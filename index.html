er. Now, if something goes wrong between teams, I talk to the other person first, and I look at my own team's part before I say anything."]], "words": 202, "kind": "answer", "setting": "Warehouse Operations Lead, a retailer in Ottawa", "cand": "Mariana", "coach": "Mariana admits she was partly wrong on the facts and completely wrong on the setting. Repairing it privately and correcting it with the director shows integrity.", "t": [[0.4, 3.15], [4.18, 12.05], [12.33, 20.61], [20.89, 22.79], [23.07, 24.54], [24.82, 28.19], [28.47, 32.42], [32.7, 35.26], [35.54, 42.26], [42.54, 43.95], [44.23, 49.45], [49.73, 51.8], [52.08, 55.45], [55.73, 63.63]]}, {"num": 40, "title": "Your Most Expensive Mistake", "lines": [["P", "What's the most expensive mistake you've made?"], ["S", "I once sent the wrong customer list to our marketing team. At the internet provider, I prepared a list of customers who were likely to cancel, so marketing could offer them a special price. There was an error in my query, and instead of excluding customers who'd already received a discount that year, I included them. About twelve thousand customers got a second discount they shouldn't have received. It cost the company around one hundred and fifty thousand reais over the following year. I found the error myself, about a week after the campaign went out, when the numbers looked strange. I told my manager the same day, with the exact number of customers affected and an estimate of the cost. We decided not to cancel the offers, because taking a discount back would have damaged trust. Then I did two things. I asked a colleague to review every query I send to another team, and I built automatic checks that compare each list against the previous campaigns. That was four years ago, and that kind of error hasn't happened again."]], "words": 188, "kind": "answer", "setting": "Senior Data Analyst, an airline in Montreal", "cand": "Fernanda", "coach": "Fernanda gives a real number, reports the mistake herself, and focuses on the systems she built afterwards. The interviewer learns she can be trusted when things go wrong.", "t": [[0.4, 2.94], [3.97, 7.21], [7.49, 15.45], [15.73, 23.52], [23.8, 28.51], [28.79, 34.17], [34.45, 40.08], [40.36, 46.86], [47.14, 52.93], [53.21, 54.59], [54.87, 64.37], [64.65, 68.38]]}, {"num": 41, "title": "Out of Your Depth", "lines": [["P", "Describe a time you were out of your depth."], ["S", "When I first arrived in Canada, I took a job as an assistant manager at a hotel restaurant, and in my second week, the manager asked me to handle the payroll and scheduling for the whole team. In Brazil, I had an accountant for payroll, and the labour rules are completely different. Here, I didn't know the rules for overtime, statutory holidays, or breaks in British Columbia. I was definitely out of my depth. But I knew that making a mistake on someone's pay is serious, especially for workers who live paycheque to paycheque. So I was honest with my manager. I told him I could learn it, but I needed a week and some help. I read the BC Employment Standards guides, I asked our payroll provider for a training session, and I found a manager at another hotel who let me ask her questions. For the first month, I asked my manager to check my work before it was submitted. By the second month, I was running it alone. And I found two errors in the previous manager's overtime calculations, which we corrected for the staff."]], "words": 197, "kind": "answer", "setting": "Food and Beverage Director, a hotel group in Toronto", "cand": "Beatriz", "coach": "Admitting you don't know something is not weakness in a Canadian interview. Beatriz asks for help early, learns systematically, and even improves on what she inherited.", "t": [[0.4, 2.79], [3.82, 15.02], [15.3, 20.31], [20.59, 26.35], [26.63, 28.53], [28.81, 35.4], [35.68, 37.62], [37.9, 41.28], [41.56, 51.5], [51.78, 56.17], [56.45, 58.71], [58.99, 64.94]]}, {"num": 42, "title": "Criticism You Thought Was Unfair", "lines": [["P", "Tell me about criticism you thought was unfair. What did you do?"], ["S", "At the startup here in Vancouver, our CEO told me in a meeting that my campaigns were too Brazilian, that they were too emotional and not direct enough for Canadian customers. Honestly, at first I thought it was unfair, and maybe a little bit of a stereotype. My campaigns were performing well, and the numbers were improving every month. But I didn't argue in the meeting. I asked him to show me an example of what he meant. He pointed to an email where I'd used three paragraphs to tell a customer story before getting to the offer. When I looked at the data more carefully, he was partly right. The emotional emails had great open rates, but the direct ones had better click-through rates with our Canadian business customers. So I tested it properly, emotional versus direct, with the same audience. The direct version won by about twenty percent. I adjusted my approach, and I told him he'd been right about that part. I still think some emotion helps, and the data showed that too. But I learned to separate how criticism is said from whether it's useful."]], "words": 201, "kind": "answer", "setting": "Content Marketing Manager, a travel company in Vancouver", "cand": "Lucas", "coach": "Lucas doesn't pretend he agreed immediately. He asks for an example, tests the criticism with data, and accepts the part that was true. That's a professional response.", "t": [[0.4, 3.02], [3.3, 4.29], [5.32, 16.15], [16.43, 21.34], [21.62, 25.93], [26.21, 27.81], [28.09, 30.76], [31.04, 37.29], [37.57, 40.94], [41.22, 48.94], [49.22, 53.64], [53.92, 56.45], [56.73, 60.85], [61.13, 64.61], [64.89, 69.01]]}, {"num": 43, "title": "Letting a Colleague Down", "lines": [["P", "When did you last let a colleague down?"], ["S", "Last year, a colleague in the budgeting team asked me to review her forecast before she presented it to the board. I said yes, and I meant it. But that week, our auditors arrived early, and I pushed her review to the end of my list. I gave it a very quick look the night before her presentation, and I told her it looked fine. It didn't. There was a formula error that doubled one of the cost lines, and a board member noticed it during her presentation. She was embarrassed, and it was partly my fault. I'd promised a review and given her a glance. The next morning, I went to her and apologised, and I told our manager that I'd reviewed it and missed the error, so it wasn't only on her. Then I helped her prepare the corrected version. What I changed is that now, when I can't do something properly, I say so immediately. I tell the person, I can't do this well until Thursday, do you want to wait or ask someone else? A clear no is much better than a bad yes."]], "words": 196, "kind": "answer", "setting": "Financial Analyst, a hospital foundation in Winnipeg", "cand": "Camila", "coach": "Camila shares the blame publicly and draws a practical rule from it. 'A clear no is better than a bad yes' is exactly the kind of lesson interviewers remember.", "t": [[0.4, 2.9], [3.93, 10.09], [10.37, 12.01], [12.29, 17.07], [17.35, 22.45], [22.73, 23.58], [23.86, 30.26], [30.54, 33.08], [33.36, 35.88], [36.16, 43.78], [44.06, 46.45], [46.73, 51.82], [52.1, 57.42], [57.7, 60.02]]}]}, {"part": 5, "title": "How You Think", "scripts": [{"num": 44, "title": "The Hardest Problems You've Solved", "lines": [["P", "Tell me about some of the most difficult problems you've worked on, and how you solved them."], ["S", "The hardest one was a bug in our payment system in Recife that only happened about once every ten thousand transactions. A customer would be charged, but our system would record the payment as failed. So they'd try again and pay twice. Three engineers had looked at it over six months and couldn't reproduce it. When I took it on, I started by collecting every case we had, about ninety of them, and I looked for anything they had in common. Time of day, bank, amount, nothing. Then I noticed that in every case, the bank's confirmation had arrived between twenty-nine and thirty-one seconds after our request. Our timeout was thirty seconds. So when the bank was slow, we'd give up at thirty seconds and mark the payment failed, and then the confirmation would arrive a moment later and nobody was listening anymore. The fix itself was small. We stopped treating a timeout as a failure and started treating it as unknown, and we checked with the bank before telling the customer anything. Duplicate charges went to zero. The hard part wasn't the code. It was being patient enough to find the pattern."]], "words": 210, "kind": "answer", "setting": "Senior Software Engineer, a payments company in Vancouver", "cand": "Rafael", "coach": "This question rewards real depth. People who actually solved a problem can describe the details without being asked. Rafael's precise numbers make his story impossible to fake.", "t": [[0.4, 4.79], [5.82, 12.99], [13.27, 17.62], [17.9, 19.68], [19.96, 23.88], [24.16, 31.39], [31.67, 33.32], [33.6, 41.21], [41.49, 43.13], [43.41, 52.97], [53.25, 54.6], [54.88, 62.62], [62.9, 64.82], [65.1, 66.64], [66.92, 69.13]]}, {"num": 45, "title": "A Belief in Your Field You Think Is Wrong", "lines": [["P", "What's a widely held belief in your field that you think is wrong?"], ["S", "In HR, a lot of people believe that the main reason employees leave is money. And when you do exit interviews, people often say it's money, because it's the polite answer. But in my experience, it's usually not the real reason. At the construction company in Brazil, we had high turnover, and the directors wanted to raise salaries by ten percent across the board. Before we did that, I asked to look at the data differently. I compared people who stayed with people who left, in the same roles, with the same pay. The biggest difference wasn't salary. It was whether their direct supervisor had been trained to manage people. Teams with a trained supervisor had about half the turnover. So instead of a general raise, we invested in a supervisor training programme, which cost much less. Turnover dropped from about forty percent to fifteen percent at the worst site. Pay matters, of course. If you pay badly, people leave. But once pay is fair, people usually leave managers, not companies."]], "words": 184, "kind": "answer", "setting": "HR Manager, a manufacturing company in Hamilton", "cand": "Juliana", "coach": "A strong answer takes a clear position, explains the evidence, and admits where the common belief is partly right. Juliana sounds confident without sounding arrogant.", "t": [[0.4, 4.01], [5.04, 9.77], [10.05, 15.02], [15.3, 18.46], [18.74, 26.55], [26.83, 29.62], [29.9, 34.36], [34.64, 36.37], [36.65, 40.28], [40.56, 43.61], [43.89, 49.67], [49.95, 53.98], [54.26, 55.56], [55.84, 57.65], [57.93, 61.9]]}, {"num": 46, "title": "Teach Me Something", "lines": [["P", "Teach me something you know well. You have two minutes."], ["S", "Okay. I'll teach you why an average can lie to you. Imagine a store where ten customers come in. Nine of them spend twenty dollars each, and one spends one thousand dollars. The average purchase is about one hundred and eighteen dollars. But if you planned your store for a customer who spends one hundred and eighteen dollars, you'd be wrong about every single person who walked in. Nobody spent that amount. That's why, when I analyse data, I almost always look at the median too. The median is the middle value when you put everything in order, and in this case, it's twenty dollars, which describes nine out of ten customers perfectly. The average and the median together tell you a story. If they're close, your customers are similar. If they're far apart, like in this example, you have a few very big customers and many small ones, and you probably need two different strategies. At the internet provider, that one idea changed how we priced our plans. So next time someone gives you an average, ask them for the median too."]], "words": 193, "kind": "answer", "setting": "Data Analyst, a retail company in Toronto", "cand": "Fernanda", "coach": "Teaching well shows you understand something deeply. Fernanda uses a simple example, one key idea, and a practical takeaway, all inside two minutes.", "t": [[0.4, 2.34], [2.62, 3.92], [4.95, 5.66], [5.94, 8.48], [8.76, 11.34], [11.62, 16.42], [16.7, 20.45], [20.73, 29.07], [29.35, 30.78], [31.06, 35.65], [35.93, 45.74], [46.02, 49.07], [49.35, 51.68], [51.96, 61.13], [61.41, 65.98], [66.26, 70.48]]}, {"num": 47, "title": "A Problem This Company Hasn't Solved", "lines": [["P", "What's a problem you think this company hasn't solved?"], ["S", "I'll be careful, because I'm looking from the outside. But from what I can see, you're very strong at winning new clinics, but I'm not sure you're keeping them. Your website lists about six hundred clinic customers. But when I read the reviews on the software comparison sites, there's a pattern. Clinics love the scheduling features, but many of them say that the first three months were hard, that setting up the billing was confusing, and that they didn't get much help. Two reviews even mention switching back to their old system. If that's happening at scale, you might be spending a lot to win clinics that leave after a year. In my last role, we had a similar problem with hospitals, and the solution wasn't a better product. It was a dedicated onboarding plan for the first ninety days, with a named person the client could call. Our first-year cancellations dropped by more than half. I'd be curious whether that matches what you see internally, or whether I'm reading too much into a few reviews."]], "words": 185, "kind": "answer", "setting": "Business Development Manager, a clinic software company in Vancouver", "cand": "Pedro", "coach": "Pedro did real research, states his view clearly, and still stays humble. Ending with 'or whether I'm reading too much into it' invites a conversation instead of sounding like criticism.", "t": [[0.4, 3.02], [4.05, 6.59], [6.87, 12.04], [12.32, 15.39], [15.67, 20.13], [20.41, 29.92], [30.2, 33.59], [33.87, 39.01], [39.29, 44.99], [45.27, 51.24], [51.52, 54.42], [54.7, 61.17]]}, {"num": 48, "title": "Cutting Thirty Percent", "lines": [["P", "If you had to cut thirty percent of your responsibilities, what would go?"], ["S", "In my current job, I'd cut most of the reporting. Right now, I spend about a day a week producing reports for three different managers. They each want similar information, but in a different format. If I had to cut thirty percent, I'd replace all three with one shared dashboard that updates automatically, and I'd stop the weekly reports completely. That alone would give me back about twenty percent of my time. The other ten percent would be the meetings where I'm there only to listen. There are two weekly meetings where I rarely speak. I'd ask for the notes instead. What I would never cut is time on the warehouse floor. I spend about an hour a day walking the floor and talking to the team, and that's where I find problems before they become expensive. It doesn't look productive on a calendar, but it's the most valuable hour of my day. So I'd cut the work that describes the operation, and protect the work that actually improves it."]], "words": 183, "kind": "answer", "setting": "Operations Manager, a distribution company in Surrey", "cand": "Mariana", "coach": "This question tests priorities. Mariana cuts with numbers, protects the one thing that really matters, and finishes with a memorable principle.", "t": [[0.4, 4.71], [5.74, 8.7], [8.98, 13.89], [14.17, 17.52], [17.8, 27.02], [27.3, 30.45], [30.73, 34.81], [35.09, 37.73], [38.01, 39.68], [39.96, 42.97], [43.25, 50.56], [50.84, 55.43], [55.71, 61.15]]}, {"num": 49, "title": "Deciding What Not to Do", "lines": [["P", "How do you decide what not to do?"], ["S", "I use a simple test. Before I start something, I ask, if this goes perfectly, what changes? And if the answer is, not much, I don't do it, even if it's a good idea. At the startup, every week someone had a new marketing idea. A podcast, a new social network, a partnership. Most of them were good ideas. But we had a team of three people. So every quarter, I'd write down our one main goal, for example, get fifty new business customers. Then every new idea had to answer one question: will this help us get those fifty customers this quarter? The podcast was a great idea, but it would take six months to build an audience. So I said, not now. That was hard, because it was the CEO's idea. But I showed him the list of what we'd have to stop to do it, and he agreed to wait. We reached sixty-two customers that quarter. The podcast started the following year, when we had more people."]], "words": 178, "kind": "answer", "setting": "Product Marketing Manager, a software company in Toronto", "cand": "Lucas", "coach": "Lucas gives the interviewer his actual decision rule and shows it working under pressure from the CEO. Saying 'not now' instead of 'no' is a useful technique.", "t": [[0.4, 2.26], [3.29, 4.61], [4.89, 9.22], [9.5, 13.66], [13.94, 17.4], [17.68, 20.38], [20.66, 22.22], [22.5, 24.17], [24.45, 30.27], [30.55, 37.08], [37.36, 42.01], [42.29, 43.57], [43.85, 46.49], [46.77, 51.42], [51.7, 53.99], [54.27, 57.68]]}, {"num": 50, "title": "Your Last Week at Work", "lines": [["P", "Walk me through your last week at work. What did you actually do?"], ["S", "Sure. Last week was fairly typical. On Monday morning, I ran our weekly coordination meeting with the site supervisors and the three subcontractors. We found a conflict between the electrical and the plumbing drawings on the fourth floor, so I spent the afternoon with the designers to fix it before anyone started work there. Tuesday and Wednesday were mostly on site. I walked every floor with the supervisor, checked the progress against the schedule, and updated our three-week look-ahead plan. Wednesday afternoon, I reviewed two change orders from subcontractors. I approved one and pushed back on the other, because the price was about thirty percent above what the work should cost. On Thursday, I wrote the monthly progress report for the client and prepared for a meeting with the city inspector. And on Friday, the inspection happened, and we passed with two minor comments, which we fixed the same day. If I had to summarise, about forty percent of my time is solving problems, thirty percent is planning, and thirty percent is communication."]], "words": 186, "kind": "answer", "setting": "Project Coordinator, an engineering consultancy in Vancouver", "cand": "Thiago", "coach": "Concrete and detailed, with no vague phrases like 'I managed stakeholders.' The final percentages show that Thiago understands how he really spends his time.", "t": [[0.4, 2.36], [2.64, 4.01], [5.04, 5.76], [6.04, 8.13], [8.41, 15.92], [16.2, 26.72], [27.0, 29.71], [29.99, 37.88], [38.16, 42.84], [43.12, 50.24], [50.52, 57.86], [58.14, 64.52], [64.8, 74.31]]}, {"num": 51, "title": "The Question I Should Ask", "lines": [["P", "What question should I be asking you that I haven't?"], ["S", "I think you should ask me how I'd handle it if our numbers told a story the leadership team didn't want to hear. Because in a finance role, that's the real test. It's easy to be accurate when the news is good. At the mining company, we had a year when one of our expansion projects was clearly going to lose money, and it was the CEO's favourite project. My director asked me to prepare the analysis. I didn't make the numbers look softer. But I also didn't just send a spreadsheet that said no. I showed three options. Continue as planned, pause for a year until metal prices recovered, or sell the project to a partner. And I showed what each one meant for our cash. The CEO chose to pause. It wasn't a comfortable meeting, but a year later, prices had recovered, and the project went ahead profitably. So if you're wondering whether I'll tell you what you want to hear, the answer is no. But I'll always bring options, not just problems."]], "words": 185, "kind": "answer", "setting": "Finance Manager, a technology company in Ottawa", "cand": "Camila", "coach": "Camila uses the question to show the one quality that matters most in her field. Preparing an answer to this question in advance is a smart move for any interview.", "t": [[0.4, 3.11], [4.14, 10.16], [10.44, 13.02], [13.3, 15.73], [16.01, 24.41], [24.69, 27.51], [27.79, 29.62], [29.9, 32.64], [32.92, 34.34], [34.62, 40.9], [41.18, 43.54], [43.82, 45.53], [45.81, 52.3], [52.58, 56.84], [57.12, 59.96]]}, {"num": 52, "title": "Good Enough to Send", "lines": [["P", "How do you know when your work is good enough to send?"], ["S", "It depends on what happens if I'm wrong. I think about it in two categories. If a mistake would be expensive or hard to undo, like a supplier contract or a price we're committing to for three years, then good enough means I've checked every number twice, and someone else has reviewed it. For those, I'd rather be a day late than wrong. But most work isn't like that. An internal update, a first draft of an analysis, a proposal for discussion. For those, good enough means it's clear, it's correct on the important points, and it's early enough that people can still react. I used to polish everything, and I was often the slowest person on the team. My manager at the food company told me once, a report that's ninety percent right on Tuesday is more useful than a perfect report on Friday. So now I ask myself two questions before I send anything. Can this decision be reversed easily? And is the person waiting for this, or waiting for perfection?"]], "words": 185, "kind": "answer", "setting": "Procurement Analyst, a utility company in Toronto", "cand": "Gustavo", "coach": "Gustavo shows judgement: different standards for different stakes. The two questions at the end give the interviewer a clear picture of how he works.", "t": [[0.4, 2.75], [3.78, 5.82], [6.1, 8.05], [8.33, 20.4], [20.68, 23.09], [23.37, 24.95], [25.23, 29.9], [30.18, 37.24], [37.52, 41.85], [42.13, 50.92], [51.2, 54.79], [55.07, 57.18], [57.46, 60.87]]}, {"num": 53, "title": "If It Didn't Work Out", "lines": [["P", "If we hired you and it didn't work out, what would the reason most likely be?"], ["S", "Honestly, I think the most likely reason would be speed. I'm used to running a restaurant where I made decisions quickly and changed things the same week. In a larger group like yours, with twelve locations and a head office, some decisions need to go through more people, and there are good reasons for that, like consistency and food safety. If I didn't adapt to that, I could get frustrated, and I might make changes at my location that don't fit the group's standards. I've thought about this, and I've already started adjusting. At the hotel restaurant here in Vancouver, which is part of a bigger chain, I learned to separate the decisions I can make alone, like staff scheduling and small service changes, from the ones I need to propose, like menu or supplier changes. For the second kind, I write a short proposal with the reason and the numbers. It's slower, but my proposals get approved more often. So I think the risk is real, but I know what it is, and I'm managing it."]], "words": 193, "kind": "answer", "setting": "Restaurant Operations Manager, a hospitality group in Calgary", "cand": "Beatriz", "coach": "This question asks you to predict your own weakness in their company. Beatriz gives a real risk, shows she understands why the company works that way, and describes how she's already adapting.", "t": [[0.4, 5.2], [6.23, 9.22], [9.5, 14.57], [14.85, 25.78], [26.06, 33.08], [33.36, 36.15], [36.43, 50.92], [51.2, 55.36], [55.64, 58.62], [58.9, 62.74]]}]}, {"part": 6, "title": "Self-Knowledge", "scripts": [{"num": 54, "title": "Good at It, but You Dislike It", "lines": [["P", "What part of your job do you do well but dislike?"], ["S", "Negotiating contract renewals, especially on price. I'm good at it. In my last role, I renewed about ninety percent of my accounts, and I usually kept the price increases we planned. But I don't enjoy it, because it can feel like the relationship becomes a battle for a few weeks. I like the part of the job where the client and I are on the same side, solving their problem. In a price negotiation, we're on opposite sides, at least for a while. What I've done about it is change how I prepare. I start renewal conversations about four months early, and the first meeting is never about price. It's about what they've achieved with our product in the past year, with real numbers. By the time we talk about price, we've already agreed on the value. It makes the negotiation shorter and less tense. I still don't love it, but I don't dread it anymore."]], "words": 167, "kind": "answer", "setting": "Account Executive, a software company in Toronto", "cand": "Pedro", "coach": "Honest, specific, and balanced. Pedro proves he's good at the task with a number, explains why he dislikes it, and shows he's found a way to make it work.", "t": [[0.4, 2.98], [4.01, 7.21], [7.49, 8.37], [8.65, 15.54], [15.82, 21.09], [21.37, 27.08], [27.36, 31.5], [31.78, 34.3], [34.58, 40.38], [40.66, 45.06], [45.34, 48.94], [49.22, 51.74], [52.02, 54.45]]}, {"num": 55, "title": "How Do You Know You're Doing Well?", "lines": [["P", "How do you know when you're doing a good job?"], ["S", "I look at three things, and only one of them is a number. The number is our on-time delivery rate. If it's above ninety-seven percent, the basics are working. But a good number can hide problems, so the second thing I look at is how many problems reach my manager. If my director is hearing about delivery issues from customers before he hears it from me, I'm not doing my job well, even if the numbers are good. And the third thing is my team. Are people asking me fewer questions over time, because they can solve more problems themselves? When I started at the warehouse in Richmond, my team came to me about twenty times a day. After six months, it was maybe five, and they were harder questions. That told me they were growing. So, good numbers, no surprises for my boss, and a team that needs me a little less every month."]], "words": 165, "kind": "answer", "setting": "Logistics Manager, a pharmaceutical distributor in Montreal", "cand": "Mariana", "coach": "Mariana shows that she measures herself by results, by communication, and by the growth of her team. Three short points, each with a clear test.", "t": [[0.4, 2.9], [3.93, 6.85], [7.13, 9.43], [9.71, 13.06], [13.34, 19.46], [19.74, 28.53], [28.81, 30.29], [30.57, 35.98], [36.26, 41.24], [41.52, 45.48], [45.76, 47.17], [47.45, 53.15]]}, {"num": 56, "title": "What Your Three Managers Would Say", "lines": [["P", "If I called your last three managers, how would each of them describe you differently?"], ["S", "That's a good question. My first manager, at the design firm, would probably say I was technically strong but too quiet. I was young, and I didn't speak up in meetings, even when I saw problems. He'd say I got much better by the end, but that was his main comment. My second manager, on the tower project, would say I was reliable and very focused on safety. She'd probably also say I could be stubborn about procedures, which is true. I didn't like shortcuts, even when the schedule was tight. And my most recent manager, on the overpass, would say I was the person who communicated best with the client. That surprised me, because it's the opposite of what my first manager said. So I think the story across all three is that I started as a quiet technical engineer, and I learned, on purpose, to become someone who can explain problems clearly to people who aren't engineers. Please do call them. I've told all three that you might."]], "words": 185, "kind": "answer", "setting": "Senior Project Engineer, a transportation firm in Edmonton", "cand": "Thiago", "coach": "Thiago tells a story of growth through three different voices, includes a real criticism, and invites the interviewer to check. That confidence is persuasive.", "t": [[0.4, 4.73], [5.76, 7.21], [7.49, 13.61], [13.89, 18.82], [19.1, 23.45], [23.73, 30.35], [30.63, 35.19], [35.47, 39.04], [39.32, 46.59], [46.87, 51.67], [51.95, 64.54], [64.82, 66.29], [66.57, 68.7]]}, {"num": 57, "title": "What People Misunderstand About You", "lines": [["P", "What do people consistently misunderstand about you at work?"], ["S", "People often think I'm less serious than I am, because I'm relaxed and I joke a lot. In Brazil, that's normal in the office, and it helps build relationships. But when I started working in Canada, I noticed that some colleagues thought I wasn't taking things seriously, especially in meetings. My manager at the startup mentioned it once. She said the CEO wasn't sure I was ready for a bigger role, even though my results were very good. That surprised me. So I made two changes. In important meetings, I start with the numbers and the recommendation, and I keep the jokes for afterwards. And I send a short written summary after every major meeting, with decisions and next steps, because it shows the structured side of how I work, which people don't always see. About three months later, the CEO asked me to present our marketing plan to the board. I haven't stopped being myself, but I've learned to show the serious part first."]], "words": 174, "kind": "answer", "setting": "Marketing Manager, a craft brewery in Victoria", "cand": "Lucas", "coach": "This answer is especially useful for newcomers. Lucas names a real cultural difference, explains the misunderstanding without blaming anyone, and shows how he adapted without losing himself.", "t": [[0.4, 3.88], [4.91, 10.01], [10.29, 14.34], [14.62, 22.49], [22.77, 25.18], [25.46, 31.65], [31.93, 33.04], [33.32, 34.77], [35.05, 41.17], [41.45, 51.5], [51.78, 56.92], [57.2, 61.57]]}, {"num": 58, "title": "The Manager Who Brings Out Your Worst", "lines": [["P", "What kind of manager brings out your worst?"], ["S", "A manager who changes priorities every day without explaining why. I had one, for about a year, at a previous company. On Monday, the most important thing was a churn analysis. On Tuesday, it was a pricing report. On Wednesday, the churn analysis was back. I understand that priorities change, especially in a growing company. But when I don't know the reason, I end up doing everything at seventy percent, and I start to lose motivation, because I never finish anything. I'm not proud of this, but I became quite passive during that period. I stopped suggesting ideas, because I thought they'd be cancelled anyway. What I learned is to ask about the reason directly. Now, when priorities change, I ask, what happened that made this more important? Usually there's a good answer, like a client complaint or a board meeting. And once I understand it, I can work with the change instead of against it. So I've learned to manage that situation. But I do my best work with managers who explain the why."]], "words": 183, "kind": "answer", "setting": "Analytics Lead, a health insurance company in Toronto", "cand": "Fernanda", "coach": "Fernanda describes behaviour, not personality, and she's honest about how she reacted badly. She also shows what she does now, so the answer ends on something she controls.", "t": [[0.4, 2.9], [3.93, 8.3], [8.58, 11.5], [11.78, 15.32], [15.6, 17.84], [18.12, 20.51], [20.79, 25.08], [25.36, 33.94], [34.22, 38.42], [38.7, 42.88], [43.16, 46.1], [46.38, 51.36], [51.64, 56.03], [56.31, 60.68], [60.96, 63.37], [63.65, 67.13]]}, {"num": 59, "title": "When Are You Difficult to Work With?", "lines": [["P", "When are you difficult to work with?"], ["S", "When someone gives me numbers without sources. If a colleague tells me a supplier is fifteen percent cheaper, my first question is always, compared to what, and where does that number come from? I ask that of everyone, including my managers. Most people appreciate it, because it prevents mistakes. But I know that it can feel like I don't trust people, especially in the first few weeks of working together, before they know me. At the food company, a colleague from sales told me that working with me felt like being audited. That was fair feedback. So now I explain why I ask, at the beginning of a working relationship. I tell people, I'm going to ask where numbers come from, and it's not personal. I do it because in procurement, one wrong number can cost us a lot of money. And I try to ask with curiosity, not suspicion. It still happens that people find me a bit demanding. But now they understand the reason."]], "words": 173, "kind": "answer", "setting": "Supply Chain Manager, a manufacturing company in Waterloo", "cand": "Gustavo", "coach": "Gustavo picks a real habit that annoys people but comes from a good place. He shares the feedback he received and explains how he now manages the effect on others.", "t": [[0.4, 2.11], [3.14, 5.68], [5.96, 14.7], [14.98, 17.65], [17.93, 21.02], [21.3, 28.38], [28.66, 34.36], [34.64, 35.88], [36.16, 40.53], [40.81, 45.12], [45.4, 49.99], [50.27, 53.19], [53.47, 56.48], [56.76, 58.49]]}, {"num": 60, "title": "Changing Your Mind", "lines": [["P", "What have you changed your mind about in the last two years?"], ["S", "Remote work. Two years ago, I believed that people needed to be in the office to build a real team culture. I'd seen it in Brazil. The office was where relationships happened, where people learned from each other by watching. When I disagreed with the decision to bring everyone back five days a week, it was mainly because of the retention risk, not because I believed in remote work. But since moving to Canada, I've worked with teams that are completely remote, and some of them have better communication than any office team I've managed. What changed my mind was seeing that culture doesn't come from a building. It comes from habits, like clear written communication, regular one-on-ones, and managers who check in deliberately. Those habits can exist anywhere. I still think that new employees benefit from time in person, especially in their first months. But I no longer think the office is the main thing. The habits are."]], "words": 171, "kind": "answer", "setting": "People and Culture Manager, a non-profit in Vancouver", "cand": "Juliana", "coach": "Juliana shows she can update her beliefs based on evidence. She explains exactly what changed her mind and still keeps a thoughtful, balanced position.", "t": [[0.4, 3.49], [4.52, 5.42], [5.7, 10.99], [11.27, 12.49], [12.77, 17.72], [18.0, 27.23], [27.51, 35.96], [36.24, 40.14], [40.42, 46.78], [47.06, 48.81], [49.09, 54.6], [54.88, 57.37], [57.65, 58.59]]}, {"num": 61, "title": "What You're Working On Now", "lines": [["P", "What are you working on improving right now?"], ["S", "Two things, one technical and one not. The technical one is system design at a larger scale. Most of my experience is with systems that serve a few hundred thousand users, and the roles I'm interested in now involve millions. So I'm reading about how large companies design their systems, and every two weeks, I practise a design problem with a friend who works at a big tech company, and she tells me where my design would break. The other thing is my English in fast, informal conversations. In meetings and technical discussions, I'm comfortable. But in quick chats, when people use a lot of slang or talk over each other, I sometimes miss things. So I've started listening to Canadian podcasts at normal speed, and I transcribe a few minutes each week to find what I'm missing. It's usually the small words, like the difference between can and can't. I can see it improving. Last month, I understood a whole team retrospective without asking anyone to repeat anything."]], "words": 177, "kind": "answer", "setting": "Software Engineer, a gaming company in Montreal", "cand": "Rafael", "coach": "Rafael chooses real gaps, explains the method he's using, and shows early progress. Mentioning transcription practice ties this answer directly to the Listening Lab method.", "t": [[0.4, 2.43], [3.46, 5.59], [5.87, 9.05], [9.33, 17.69], [17.97, 29.7], [29.98, 33.76], [34.04, 36.9], [37.18, 42.92], [43.2, 51.01], [51.29, 55.15], [55.43, 56.71], [56.99, 62.88]]}, {"num": 62, "title": "You Now Versus Five Years Ago", "lines": [["P", "What's different about how you work now compared to five years ago?"], ["S", "Five years ago, I thought my job was to be right. Now I think my job is to be useful. When I was younger, I'd spend a week making an analysis perfect, and then present it and defend every number. If someone disagreed, I felt it was an attack on my work. Now I share my analysis much earlier, when it's maybe sixty percent done, and I ask people what they think is missing. The operations managers usually know things that aren't in any system, like a supplier that's about to raise prices, or a machine that's going to need expensive maintenance. Getting that information early makes my work much better than working alone for another week. The other big change is that I talk to people much more than I send emails. Earlier in my career, I sometimes hid behind spreadsheets. Here in Canada, I've had to build relationships from zero, so I've learned to walk over and ask a question in person. Both changes came from the same lesson. The best analysis is done with people, not for them."]], "words": 193, "kind": "answer", "setting": "Senior Financial Analyst, an energy company in Calgary", "cand": "Camila", "coach": "A good answer to this question shows growth in how you think, not just new skills. Camila's final line connects both changes into one clear lesson.", "t": [[0.4, 4.39], [5.42, 8.28], [8.56, 10.69], [10.97, 17.05], [17.33, 20.64], [20.92, 27.79], [28.07, 38.35], [38.63, 43.41], [43.69, 48.17], [48.45, 51.84], [52.12, 58.71], [58.99, 61.13], [61.41, 64.26]]}, {"num": 63, "title": "What You Need but Never Asked For", "lines": [["P", "What do you need from a workplace that you've never asked for?"], ["S", "That's an interesting question, and I had to think about it. I think it's clear feedback, even when it's small. In the restaurant business, everyone is very busy, and managers usually only hear from their bosses when something goes wrong. When things are going well, there's silence. And for a long time, I thought that was normal, and I never asked for more. But I've realised that I work better when I know what I'm doing well, not just what I'm doing badly. It helps me repeat the right things. In my last job, I never told my manager that. Now that I think about it, I should have. So if I join your team, I'll probably ask for a short monthly conversation, fifteen minutes, where we talk about what's working and what's not. I'd do the same for my own team. I've noticed that when I tell my staff specifically what they did well, like how they handled a difficult guest, they do it again. So I'm really asking for something I already try to give."]], "words": 189, "kind": "answer", "setting": "General Manager, a café chain in Toronto", "cand": "Beatriz", "coach": "Beatriz treats the question seriously, admits she never asked, and turns her need into a simple, reasonable request. She links it to how she manages others.", "t": [[0.4, 3.9], [4.93, 7.92], [8.2, 10.67], [10.95, 17.82], [18.1, 20.21], [20.49, 24.46], [24.74, 30.2], [30.48, 32.36], [32.64, 35.6], [35.88, 38.02], [38.3, 46.45], [46.73, 48.52], [48.8, 55.71], [55.99, 58.93]]}]}, {"part": 7, "title": "Motivation and Fit", "scripts": [{"num": 64, "title": "Why Should We Hire You?", "lines": [["P", "We've talked to a lot of good candidates. Why should we hire you?"], ["S", "Because you're opening a second distribution centre next spring, and you need someone who can get a new site running without constant help from head office. That's exactly what I did in São Paulo. When our company opened a new warehouse in Campinas, I was sent to set up the operation. I hired and trained the first twenty people, designed the picking routes, and within four months, the new site had the best on-time rate in the company, at ninety-six percent. And there's one more thing that I think the other candidates probably can't offer. About a third of the warehouse workers in this region speak Portuguese or Spanish as their first language. I speak both. In my current job, that's made a real difference in training and in safety, because people ask questions when they can ask in their own language. So you'd get someone who's opened a site before, and someone who can talk to your whole team."]], "words": 173, "kind": "answer", "setting": "Distribution Centre Supervisor, a grocery distributor in Surrey", "cand": "Mariana", "coach": "The three-part formula: name their problem, give one piece of evidence that you've solved it before, and add one thing that's unusual about you. Mariana's bilingual advantage is exactly the card many newcomers hide.", "t": [[0.4, 2.66], [2.94, 4.41], [5.44, 13.87], [14.15, 16.41], [16.69, 21.9], [22.18, 32.67], [32.95, 37.39], [37.67, 43.84], [44.12, 45.03], [45.31, 53.63], [53.91, 58.56]]}, {"num": 65, "title": "Still Here in Three Years", "lines": [["P", "What would have to be true for you to still be here in three years?"], ["S", "Three things, I think. First, I'd need to be working on problems that are still hard for me. I've stayed in jobs for a long time when I was learning, and I've left when I wasn't. At the fintech company, I stayed four years because the payment system kept getting more complex. Second, I'd want a path toward technical leadership. Not necessarily managing people, but being the person who designs systems and helps other engineers grow. From what you've told me about the staff engineer track here, that path exists, which is one of the reasons I applied. And third, and this is more personal, I'd need to feel that my opinion counts in technical decisions, even though English is my second language. In a previous job, I sometimes felt that the people who spoke fastest won the argument, not the people with the best idea. The way your team writes design documents before decisions, which you mentioned earlier, makes me think that won't be a problem here."]], "words": 183, "kind": "answer", "setting": "Backend Developer, a software company in Waterloo", "cand": "Rafael", "coach": "Rafael answers honestly and connects each condition to something he's learned about the company. He also shows he was listening earlier in the interview.", "t": [[0.4, 3.17], [4.2, 5.27], [5.55, 9.22], [9.5, 14.17], [14.45, 20.0], [20.28, 23.01], [23.29, 29.67], [29.95, 36.43], [36.71, 45.25], [45.53, 52.76], [53.04, 60.33]]}, {"num": 66, "title": "What Would Make You Leave?", "lines": [["P", "What would make you leave a job?"], ["S", "The clearest reason would be if I were asked to do something I thought was unfair to employees and I couldn't change it. In HR, you sometimes have to carry out difficult decisions, like layoffs or policy changes that people don't like, and I can do that professionally. But there's a difference between a difficult decision and an unfair one. At a previous company, I once had a manager who wanted to dismiss an employee shortly after she returned from maternity leave, with a reason that was clearly invented. I refused to process it, and I took it to the director. Luckily, the director agreed with me, and it didn't happen. But if the company had supported it, I would have left. Other than that, the usual reasons would be if I stopped learning for a long time, or if there was no way to grow. But those are things I'd talk about with my manager long before I thought about leaving. I don't like to leave quietly. I prefer to raise the problem while there's still time to fix it."]], "words": 188, "kind": "answer", "setting": "HR Generalist, a healthcare organisation in Victoria", "cand": "Juliana", "coach": "Juliana gives one principled reason, supports it with a real story, and makes clear she raises problems early. That tells the employer she's loyal but not blindly obedient.", "t": [[0.4, 2.19], [3.22, 9.54], [9.82, 18.67], [18.95, 22.6], [22.88, 32.35], [32.63, 35.6], [35.88, 38.88], [39.16, 41.7], [41.98, 48.49], [48.77, 53.4], [53.68, 55.24], [55.52, 58.69]]}, {"num": 67, "title": "Money, Title, Learning or Stability?", "lines": [["P", "Right now, which matters most to you: money, title, learning, or stability? Be honest."], ["S", "Honestly, right now it's stability, followed closely by money. And I'll explain why, because I think it's useful for you to know. My family and I moved to Canada two years ago. We've been renting, my wife is finishing her nursing licence here, and we have two kids in school. For the first time in my career, the most important thing is a role where I can plan the next three to five years. That doesn't mean I don't want to grow. I do. But I'm not looking for a job to use as a step to the next one. I'm looking for a company where I can stay, build a territory, and grow with it. Money is close behind, because sales is a job where I want to be paid for results, and your commission structure rewards that. Title matters least to me. I've had bigger titles in Brazil. I'd rather have a smaller title here and hit my numbers than the reverse."]], "words": 178, "kind": "answer", "setting": "Sales Manager, a medical supply company in Vancouver", "cand": "Pedro", "coach": "The interviewer asked for honesty, so Pedro gives it, with a reason. Explaining his situation makes the answer believable and shows the employer he's likely to stay.", "t": [[0.4, 4.84], [5.12, 6.03], [7.06, 10.61], [10.89, 14.41], [14.69, 17.42], [17.7, 23.05], [23.33, 29.75], [30.03, 31.95], [32.23, 32.89], [33.17, 36.57], [36.85, 41.2], [41.48, 48.99], [49.27, 50.63], [50.91, 52.64], [52.92, 56.8]]}, {"num": 68, "title": "Your First Ninety Days", "lines": [["P", "What did you do in your first ninety days at your last job?"], ["S", "I divided it into three parts of about a month each. In the first month, I mostly listened. I met every plant manager, every person on my team, and our twenty largest suppliers. I asked each of them the same three questions: what works well, what doesn't, and what would you change if you were me? I didn't change anything, even though I saw problems in the first week. In the second month, I analysed the data. I grouped all our spending by category and compared it to what people had told me. Where the data and the stories matched, I knew I'd found a real problem. And in the third month, I chose three priorities, not ten. Written contracts with our top suppliers, a backup supplier for critical items, and a simpler purchase approval process. I presented them to my director with a six-month plan. By day ninety, we'd already signed the first four contracts. I'd follow a similar structure here, but I'd probably spend even more time listening, because I'm new to the Canadian healthcare system."]], "words": 191, "kind": "answer", "setting": "Procurement Manager, a hospital network in Toronto", "cand": "Gustavo", "coach": "Gustavo's listen, analyse, act structure is exactly what Canadian managers hope to hear. Adapting it to the new job shows humility about what he doesn't know yet.", "t": [[0.4, 3.34], [4.37, 7.47], [7.75, 9.75], [10.03, 15.41], [15.69, 22.22], [22.5, 26.38], [26.66, 28.9], [29.18, 33.83], [34.11, 38.33], [38.61, 41.86], [42.14, 49.39], [49.67, 52.76], [53.04, 56.46], [56.74, 64.74]]}, {"num": 69, "title": "What You Want to Be Doing", "lines": [["P", "What do you want to be doing that you're not doing now?"], ["S", "I want my work to lead to decisions that affect a lot of people's daily lives. Right now, I'm a data analyst at an e-commerce company. The work is interesting, but most of my analyses are about getting customers to buy a little more. I'm good at it, but it doesn't motivate me the way it used to. What I'd like to do is use the same skills on problems like transit, where a better analysis can mean a bus arrives more often in a neighbourhood that needs it. When I lived in Porto Alegre, I took two buses to work every day, an hour and a half each way, and I used to think about how the routes could be planned better. Here, I've already started a small personal project, using the public data from TransLink to look at how waiting times change across the city. I'd love to do that professionally, with better data and people who know the system much better than I do."]], "words": 179, "kind": "answer", "setting": "Data Scientist, a public transit agency in Vancouver", "cand": "Fernanda", "coach": "Fernanda connects her motivation to a personal experience and proves her interest with a project she's already started. That makes her answer much more than a wish.", "t": [[0.4, 3.41], [4.44, 9.24], [9.52, 13.08], [13.36, 19.4], [19.68, 23.26], [23.54, 33.57], [33.85, 43.15], [43.43, 52.82], [53.1, 59.28]]}, {"num": 70, "title": "Where You Don't Want to Go", "lines": [["P", "Where do you not want your career to go?"], ["S", "I don't want to become a manager who only manages spreadsheets and never goes to site. I've seen it happen to good engineers. They get promoted, and after a few years, they're in meetings all day, and they lose touch with how the work is actually done. Then they make decisions that look good on paper but don't work in the field. I want to grow into project management, and I'm working toward my Canadian engineering licence right now. But I want to keep at least part of my time on site, close to the people doing the work. On my last project, I spent about half my time on site, and that's where I caught most of the problems that saved us time and money. So in five or ten years, I'd like to lead bigger projects. But if a role meant I'd never put on boots again, I'd probably say no, even if the salary was higher."]], "words": 168, "kind": "answer", "setting": "Project Engineer, a hydro-electric company in Winnipeg", "cand": "Thiago", "coach": "Answering what you don't want tells the interviewer a lot about what you do want. Thiago is clear, gives a reason, and still shows ambition.", "t": [[0.4, 2.23], [3.26, 8.68], [8.96, 11.16], [11.44, 19.16], [19.44, 23.97], [24.25, 30.92], [31.2, 36.28], [36.56, 44.9], [45.18, 49.13], [49.41, 56.11]]}, {"num": 71, "title": "Deciding Between Two Offers", "lines": [["P", "If you had two offers, what would decide it?"], ["S", "Mostly the manager, and then the product. Salary matters, of course, but if two offers are close, I'd choose the manager I'd learn the most from. In my career, the jobs where I grew the most weren't the ones with the best title or the best salary. They were the ones where my boss was honest with me and gave me room to try things. At the sports shoe company, my director let me run the local coaches test when everyone else wanted to keep spending on famous athletes. I learned more in that one year than in the three years before. The second thing is whether I believe in the product. I'm much better at marketing something I actually use. That's one of the reasons I'm excited about this role. I've been cycling for ten years, and I already own two of your products. So if you ask me honestly, after meeting you today, I think this conversation has already helped your offer quite a lot."]], "words": 176, "kind": "answer", "setting": "Senior Marketing Manager, a sporting goods company in Calgary", "cand": "Lucas", "coach": "Lucas gives a clear rule, supports it with a real story, and ends with a warm, confident line that fits the conversation without sounding like flattery.", "t": [[0.4, 2.62], [3.65, 5.87], [6.15, 11.99], [12.27, 18.18], [18.46, 23.05], [23.33, 31.5], [31.78, 34.96], [35.24, 37.93], [38.21, 41.19], [41.47, 44.4], [44.68, 48.64], [48.92, 56.01]]}]}, {"part": 8, "title": "Your Questions for Them", "scripts": [{"num": 72, "title": "What Makes a Good Hire in Ninety Days?", "lines": [["P", "We're almost out of time. Do you have any questions for me?"], ["S", "Yes, I do, thank you. What does someone in this role need to do in the first ninety days for you to say, this was a good hire?"], ["P", "That's a good question. Honestly, the first thing is learning our system without breaking anything. We use a warehouse management system that takes a while to understand, and the people who struggle are the ones who try to change processes before they understand them. So by day thirty, I'd want you to be running a shift on your own. By day sixty, I'd want you to have found at least one problem we haven't noticed. Fresh eyes are valuable. And by day ninety, I'd hope the team trusts you enough to bring you their problems. That last one is the hardest, and it's the one I care about most."], ["S", "That's really helpful. The trust part is what I'd focus on too. At my last site, I spent my first month working alongside each shift, so people saw me doing the work before I asked them to do anything differently."]], "words": 189, "kind": "ask", "setting": "Operations Coordinator, a logistics company in Vancouver", "cand": "Mariana", "coach": "This question shows you're already thinking about succeeding in the job. Listen for the answer, then connect it to your experience, as Mariana does in her follow-up.", "t": [[0.4, 2.09], [2.37, 4.33], [5.36, 6.81], [7.09, 12.61], [13.64, 15.09], [15.37, 19.92], [20.2, 30.87], [31.15, 35.07], [35.35, 40.07], [40.35, 42.09], [42.37, 47.3], [47.58, 51.7], [52.73, 53.9], [54.18, 56.64], [56.92, 65.43]]}, {"num": 73, "title": "The Hardest Part Not in the Description", "lines": [["S", "What's the hardest part of this job that isn't in the job description?"], ["P", "Hmm. Good question. I'd say it's the legacy code. The job description talks about building new features, and you will. But about half the system was written eight years ago by people who aren't here anymore, and there isn't much documentation. Some parts are fragile. So a lot of the work, especially in the first six months, is understanding why things were built the way they were before you change them. Some developers find that frustrating. They want to build new things from day one."], ["S", "I appreciate you being honest about that. I actually like that kind of work. At my last company, I spent a lot of time on an older payment system, and I found that the documentation I wrote while learning it became useful for the whole team. Is there time in the schedule for that, or would it be done alongside the feature work?"], ["P", "Right now, it's mostly alongside. But we've talked about giving each developer one day a sprint for it. If you're someone who writes things down, that would definitely help."]], "words": 190, "kind": "ask", "setting": "Senior Developer, a health technology company in Toronto", "cand": "Rafael", "coach": "This question tells you what the job is really like, and interviewers respect it. Rafael follows up with a second question, which turns the exchange into a real conversation.", "t": [[0.4, 4.07], [5.1, 5.7], [5.98, 7.0], [7.28, 8.97], [9.25, 12.83], [13.11, 19.45], [19.73, 21.13], [21.41, 28.56], [28.84, 30.95], [31.23, 33.24], [34.27, 36.38], [36.66, 38.35], [38.63, 48.18], [48.46, 53.03], [54.06, 56.04], [56.32, 59.67], [59.95, 63.41]]}, {"num": 74, "title": "Who Held This Role Before?", "lines": [["S", "Could you tell me who held this role before, and what happened to them?"], ["P", "Sure. The last person in the role was with us for about three years. She was very good, and she was promoted to finance manager at our Calgary office last month. So, a good story. Before her, the role was held by someone who left after about eight months. To be honest, that was partly our fault. At that time, we didn't have a clear process for month-end, and there was a lot of pressure on this role. We've fixed most of that since then."], ["S", "Thank you, that's useful to know. It's good to hear the role can lead to a promotion. When you say you've fixed most of the month-end process, what's still left to improve?"], ["P", "Mainly the reporting to the project managers. It's still quite manual. Honestly, that's one of the things we'd like the new person to help with."]], "words": 156, "kind": "ask", "setting": "Financial Analyst, a construction company in Edmonton", "cand": "Camila", "coach": "This question can reveal whether a role is a stepping stone or a revolving door. Camila listens, then asks about the problem that remains, which is often where the new hire can add the most value.", "t": [[0.4, 3.62], [4.65, 5.38], [5.66, 9.43], [9.71, 15.58], [15.86, 17.33], [17.61, 22.09], [22.37, 24.8], [25.08, 31.29], [31.57, 33.66], [34.69, 36.53], [36.81, 39.28], [39.56, 43.93], [44.96, 47.89], [48.17, 49.81], [50.09, 54.21]]}, {"num": 75, "title": "What the Team Is Not Good At Yet", "lines": [["S", "What is the team not good at yet?"], ["P", "That's a question I don't get very often. Let me think. I'd say measurement. We're very creative, and we produce a lot of campaigns. But we're not good at knowing which ones actually bring in customers. We look at clicks and likes, but we don't really connect our work to sales. Our CEO asks me about it every quarter, and I don't have a good answer."], ["S", "That's interesting, because that's probably the area where I can help most. At the startup, I set up a simple way to track each lead from the first ad to the signed contract. It wasn't complicated, but it changed how we spent the budget. Would the new manager have access to the sales data in your CRM, or is that controlled by the sales team?"], ["P", "They'd have access. Getting the two teams to use it the same way is the real challenge."]], "words": 156, "kind": "ask", "setting": "Marketing Manager, a software company in Vancouver", "cand": "Lucas", "coach": "The team's weakness is often the reason you're being hired. Lucas hears it, links it to his experience in one or two sentences, and asks a practical question.", "t": [[0.4, 1.98], [3.01, 5.38], [5.66, 6.6], [6.88, 8.05], [8.33, 11.49], [11.77, 14.92], [15.2, 18.94], [19.22, 23.16], [24.19, 28.12], [28.4, 34.18], [34.46, 37.94], [38.22, 45.07], [46.1, 47.18], [47.46, 51.11]]}, {"num": 76, "title": "How Will You Measure My Success?", "lines": [["S", "My last question. How will you measure whether I'm succeeding six months from now?"], ["P", "We look at three numbers for every location. Food cost, labour cost as a percentage of sales, and our guest review score. For your location, the review score is the most important right now. It dropped from four point five to about four point one last year, mainly because of slow service. So if the score is back above four point four in six months, and the costs are stable, I'd be very happy. The other thing I'll look at, which isn't a number, is staff turnover. That location has lost a lot of servers recently."], ["S", "That's very clear, thank you. If I'm lucky enough to get the role, I'd probably start with the staff turnover, because in my experience, slow service and high turnover are usually the same problem. New servers are slower. Could I speak to a few of the current staff during my first week, before I make any changes?"], ["P", "Absolutely. I think they'd appreciate that."]], "words": 173, "kind": "ask", "setting": "Restaurant General Manager, a hospitality group in Toronto", "cand": "Beatriz", "coach": "Asking how success is measured shows confidence and gives you a clear target. Beatriz connects the two problems she hears, which shows the interviewer how she already thinks about the job.", "t": [[0.4, 1.57], [1.85, 4.9], [5.93, 8.49], [8.77, 13.77], [14.05, 18.53], [18.81, 25.18], [25.46, 32.61], [32.89, 36.71], [36.99, 40.3], [41.33, 42.8], [43.08, 52.74], [53.02, 54.39], [54.67, 59.7], [60.73, 61.91], [62.19, 64.17]]}]}];
const PART_DESC = {

const TEACHER_EMAIL = "executiveclass.ca@gmail.com";
/* ===== RECORDINGS ===========================================================
   MP3 files live in the "audio" folder beside this page, named by script
   number: audio/Script-01.mp3 ... audio/Script-76.mp3. Each script in BOOK has
   "t": the start and end time of every sentence, so students can replay one
   sentence at a time and follow the highlighted text in sync.
   If a recording is missing, the lab falls back to the device's voices.      */
const AUDIO_BASE = "audio/";
const AUDIO_EXT = ".mp3";
/* =========================================================================== */

const SMALL = new Set("a an the to too for since from by until at in on of do does did don't doesn't didn't is isn't was wasn't were weren't are aren't am can can't could couldn't will won't would wouldn't should shouldn't have has had haven't hasn't hadn't been be he she him her they them we us it its it's that than then this these those there their they're you your you're i i'm i'd i'll i've me my and or but if so not no as with".split(" "));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WHO = { P: "Interviewer", S: "Candidate" };
const ALL = [];
BOOK.forEach(p => p.scripts.forEach(s => { s.part = p.part; s.partTitle = p.title; ALL.push(s); }));
const byNum = n => ALL.find(s => s.num === n);
const minutes = w => { const m = w / 140; return m < 1.25 ? "about 1 minute" : `about ${Math.round(m * 2) / 2} minutes`.replace(".5", "½"); };
const fullText = s => s.lines.map(l => l[1]).join(" ");
function sentencesOf(text) { return text.replace(/\s+/g, " ").match(/[^.!?]+[.!?]+["”’')]*(\s|$)|[^.!?]+$/g)?.map(x => x.trim()).filter(Boolean) || [text]; }
function segsOf(s) { const out = []; s.lines.forEach((l, ti) => sentencesOf(l[1]).forEach(t => out.push({ sp: l[0], t, turn: ti }))); return out; }

/* local progress (this browser only) */
const store = {
  get(k, d) { try { const v = localStorage.getItem("iil:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("iil:" + k, JSON.stringify(v)); } catch {} }
};
let DONE = new Set(store.get("done", []));
const markDone = n => { DONE.add(n); store.set("done", [...DONE]); renderProgress(); };

/* recordings */
const audioUrl = n => `${AUDIO_BASE}Script-${String(n).padStart(2, "0")}${AUDIO_EXT}`;
const audioCache = {};
function checkAudio(n) {
  if (n in audioCache) return Promise.resolve(audioCache[n]);
  return new Promise(res => {
    const a = new Audio(), done = ok => { audioCache[n] = ok; res(ok); };
    a.addEventListener("loadedmetadata", () => done(true), { once: true });
    a.addEventListener("error", () => done(false), { once: true });
    a.preload = "metadata"; a.src = audioUrl(n);
    setTimeout(() => { if (!(n in audioCache)) done(false); }, 4000);
  });
}

/* ---------- navigation ---------- */
function renderProgress() {
  const n = DONE.size, pct = Math.round(n / ALL.length * 100);
  $("#progMini").innerHTML = `${n} of ${ALL.length} questions completed<div class="bar"><i style="width:${pct}%"></i></div>`;

let voices = [], RUN = 0;

const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|princess|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|agnes|bruce|vicki|victoria)\b/i;
const FEMALE = /female|samantha|ava|zoe|allison|susan|nicky|karen|moira|tessa|serena|kate|stephanie|fiona|catherine|martha|aria|jenny|zira|libby|sonia|natasha|clara|emma|michelle|joanna|kendra|salli|hazel|ruth|isla|evie|google us english|google uk english female/i;
const MALE = /\bmale\b|alex|aaron|evan|nathan|tom|daniel|oliver|arthur|lee|gordon|rishi|guy|christopher|eric|andrew|brian|roger|ryan|liam|william|david|mark|matthew|james|thomas|noah|jamie/i;
const GOOD = /samantha|alex|ava|zoe|allison|susan|evan|nathan|tom|daniel|karen|moira|tessa|serena|kate|oliver|arthur|jenny|aria|guy|libby|sonia|ryan|clara|liam|natural|neural|google/i;

}

  const others = voices.filter(v => v !== p);

}

    <p class="hint">Listen to the whole exchange once. Don't write while you listen. When it finishes, answer these questions in your own words.</p>
    ${playerHTML()}${dialogueHTML(s, false)}
    <ul class="prompts" style="margin-top:18px">${gistQs.map(q => `<li>${q}</li>`).join("")}</ul>
    <div class="field"><label for="gist">Your answers</label><textarea id="gist" class="short">${esc(ST.gist)}</textarea></div>${nextRow(k)}`;
  if (k === 1) P.innerHTML = `<h3>Round 2: Transcribe</h3>
    <p class="hint">Play one sentence at a time and write exactly what you hear. Replay a sentence as many times as you need. If you can't hear a word, leave a space and keep going.</p>
    ${playerHTML({ lines: true })}${dialogueHTML(s, false)}${answerBox}${nextRow(k)}`;
  if (k === 2) P.innerHTML = `<h3>Round 3: Listen again and fix</h3>
    <p class="hint">Play the whole script from the beginning and follow your transcription. Fix anything you're unsure about. Listen closely for the small words: <i>a, the, to, of, it's, don't, that</i>.</p>
    ${playerHTML()}${answerBox}${nextRow(k)}`;
  if (k === 3) P.innerHTML = `<h3>Round 4: Compare</h3>
    <p class="hint">Check your transcription against the script. Look at the words you missed. Were they small words? Words linked together? Business words you didn't know?</p>
    ${answerBox}<div class="actions"><button class="btn gold" id="check">Check my transcription</button></div><div id="result"></div>${nextRow(k)}`;
  if (k === 4) P.innerHTML = `<h3>Round 5: Study the answer</h3>
    <p class="hint">Now the script is visible. Follow the highlight while the voices speak, and tap any sentence to hear it from there. ${ask ? "Notice how the candidate listens, then links the answer to their own experience." : "Find the four parts of the answer: situation, task, action, result. Count how many times the candidate says “I” in the action."} Write down two or three phrases you'd like to use yourself.</p>
    ${playerHTML({ resume: false })}${dialogueHTML(s, true)}
    <div class="coach"><h4>Why this answer works</h4><p>${esc(s.coach)}</p></div>${nextRow(k)}`;
  if (k === 5) P.innerHTML = `<h3>Round 6: Echo, then answer it yourself</h3>
    <p class="hint">After each sentence there's a pause. Say the sentence out loud, copying the rhythm and the stress. When you're ready, tick the box and take the candidate's part: the candidate's voice goes quiet and you say the lines yourself.</p>
    ${playerHTML({ echo: true })}${dialogueHTML(s, true)}
    <div class="mine"><h4>${ask ? "Your version" : "Your own answer"}</h4>
      <ul class="prompts">${(ask
        ? ["Write this question in your own words, for a job you want.", "Add one follow-up question you could ask after hearing the answer.", "Practise saying both out loud, calmly, as a normal part of the conversation."]
        : ["Choose one of your own stories. Situation and task in two sentences.", "Action: three or four steps, each starting with “I.”", "Result: a number, or a clear consequence.", "Say it out loud and time it. Aim for under two minutes."]).map(q => `<li>${q}</li>`).join("")}</ul>
      <div class="field"><label for="mineTxt">Notes for my answer (saved in this browser)</label><textarea id="mineTxt" class="short">${esc(store.get("mine:" + s.num, ""))}</textarea></div>
    </div>${nextRow(k)}`;
  if ($("#mineTxt")) $("#mineTxt").oninput = e => store.set("mine:" + s.num, e.target.value);
  if (k !== 3) wirePlayer(s, { echo: k === 5, tapOne: k === 5 });
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if ($("#finish")) $("#finish").onclick = () => { ST.done.add(5); markDone(ST.num); renderScript(ST.num); renderNav($("#q").value); };
  if (k === 3) { $("#check").onclick = () => { saveFields(); check(s); }; if (ST.result) showResult(s); }
}

/* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'éãçõáíóúâêô½%]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').replace(/—|–/g, " ").split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
function check(s) {
  const FULL = tokens(fullText(s)), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  const lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), other = [], extra = [], rest = [];
  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), other, extra };
  ST.done.add(3); showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the script yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  const acad = [...new Set(R.other.filter(w => w.length > 7))].slice(0, 20);
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="send">Email my results to Ron</button><button class="btn secondary" id="copy">Copy my results</button></div>
      <p>This opens your email app with your results already written. Nothing is sent until you press send. If your email app doesn't open, copy your results and paste them into an email to ${TEACHER_EMAIL}.</p>
      <p class="status" id="status" role="status"></p>
    </div></div>`;
  $("#sname").oninput = e => { ST.name = e.target.value; store.set("name", ST.name); };
  $("#send").onclick = () => { location.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(`Interview Lab: Question ${s.num}, ${s.title}`)}&body=${encodeURIComponent(resultText(s))}`; };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    $("#status").textContent = "Copied. Paste it into an email or a message to Ron.";
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Interview Lab results", `Name: ${ST.name || "(not given)"}`, `Question: ${s.num}. ${s.title} (Part ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
</html>
