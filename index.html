<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Lab | Ron Taylor Masterclass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15292a; --navy-2:#1e393a; --navy-3:#2b4c4d; --chalk:#e3ecea; --dim:#97b0ad;
  --paper:#f4f5f3; --white:#fff; --ink:#1b2524; --muted:#56635f; --rule:#d8dedb;
  --gold:#d3874a; --gold-soft:#f8e7d7;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#1f5f5b; --p2:#7a3b2e; --p3:#2f4f86; --p4:#8a3b5a; --p5:#5f5a1c;
  --p6:#3d6b3a; --p7:#9a5a12; --p8:#4b3f8f; --p9:#384a62;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar" aria-label="Scripts">
    <div class="brand">
      <div class="crest" aria-hidden="true">IL</div>
      <div><h1>Interview Lab</h1><p>Ron Taylor Masterclass</p></div>
    </div>
    <div class="search">
      <label for="q" style="position:absolute;left:-9999px">Search questions</label>
      <input id="q" type="search" placeholder="Search questions and topics">
    </div>
    <div class="progress-mini" id="progMini"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>

<script>
const BOOK = [{"part": 1, "title": "Opening Questions", "scripts": [{"num": 1, "title": "Tell Me About Yourself", "lines": [["P", "Thanks for coming in, Mariana. Let's start with an easy one. Tell me about yourself."], ["S", "Sure. I'm an operations coordinator, and for the last seven years I've worked in logistics, first in São Paulo and now here in Vancouver. In Brazil, I worked for a distribution company that moved medical supplies to about two hundred clinics. My job was to keep deliveries on time when something unexpected happened, like a truck breaking down or a road closing after heavy rain, and I became very good at finding solutions quickly. The project I'm proudest of is a new routing schedule I designed. It cut late deliveries from about fifteen percent to under four percent in one year. I moved to Canada eighteen months ago, and since then I've been working at a warehouse in Richmond while I finished a supply chain certificate at BCIT. What I'm looking for now is a coordinator role where I can use what I did in Brazil at a bigger scale. When I saw that you're opening a second distribution centre in Surrey, I thought, that's exactly the kind of problem I like to solve."]], "words": 189, "kind": "answer", "setting": "Operations Coordinator, a logistics company in Vancouver", "cand": "Mariana", "coach": "Present, past, future, in under ninety seconds. Mariana gives one number, connects her Brazilian experience to the job, and ends with the employer's problem, not her own wishes.", "t": [[0.4, 2.38], [2.66, 4.58], [4.86, 6.49], [7.52, 8.05], [8.33, 16.84], [17.12, 23.54], [23.82, 35.9], [36.18, 40.4], [40.68, 45.67], [45.95, 54.57], [54.85, 61.0], [61.28, 68.96]]}, {"num": 2, "title": "Why This Role?", "lines": [["P", "You've probably applied to a few developer jobs. Why this role, specifically, rather than the other ones you could have applied for?"], ["S", "That's fair. I have applied to other roles, and I'll be honest about how I chose this one. Most of the backend jobs I see are about building new features quickly. This one is different. The posting talks about reliability, about payments that can't fail, and about reducing incidents. That's the work I actually enjoy. At my last company in Recife, I spent two years on our payment system, and my biggest contribution wasn't a feature. It was bringing our failed transactions down from about one in two hundred to one in three thousand. I also noticed that you're expanding into Brazil next year. I know how Pix works, I know the central bank's rules, and I've integrated with three Brazilian banks. So for me, this isn't just another developer job. It's the one where my background is an advantage and not just a line on my resume."]], "words": 170, "kind": "answer", "setting": "Backend Developer, a fintech company in Toronto", "cand": "Rafael", "coach": "He answers 'why this one' with two specifics from the job posting, then proves each with his own experience. Naming the Brazil expansion turns his background into a selling point.", "t": [[0.4, 3.11], [3.39, 7.42], [8.45, 9.2], [9.48, 13.47], [13.75, 17.93], [18.21, 19.36], [19.64, 25.46], [25.74, 27.52], [27.8, 34.84], [35.12, 40.98], [41.26, 44.48], [44.76, 50.76], [51.04, 53.96], [54.24, 59.17]]}, {"num": 3, "title": "What Do You Know About Us?", "lines": [["P", "Before we go any further, what do you know about us?"], ["S", "I did some reading before today. You started as a single family grocery store in Calgary in the nineteen-seventies, and now you have forty-two stores across Alberta and Saskatchewan. What stood out to me in your annual report was that you've kept your profit margins steady while other grocers have had trouble, and it looks like that's partly because you buy directly from local farms instead of through big distributors. I also read that you're planning to open six stores in smaller towns over the next three years. That's interesting to me, because opening stores in small markets means you need good forecasts. How much will a new store sell in its first year? When does it break even? That's the kind of analysis I did for a pharmacy chain in Brazil, when they opened fourteen locations in the interior of Minas Gerais. So I'd be very curious to hear how you're approaching those decisions."]], "words": 166, "kind": "answer", "setting": "Financial Analyst, a grocery chain in Calgary", "cand": "Camila", "coach": "Facts first, then one insight, then a link to her own experience. Ending with a question turns a memory test into a real conversation.", "t": [[0.4, 3.39], [4.42, 6.17], [6.45, 15.41], [15.69, 29.0], [29.28, 34.68], [34.96, 40.22], [40.5, 42.89], [43.17, 44.5], [44.78, 53.01], [53.29, 56.75]]}, {"num": 4, "title": "Walk Me Through Your Career", "lines": [["P", "Walk me through your career, but don't tell me what each job was. Tell me why you made each move."], ["S", "Okay. I started in an advertising agency in Rio, because I wanted to learn from people who were better than me, and I did. But after three years I realised that at an agency, you never see what happens after the campaign ends. So I moved to the client side, to a sports shoe company, because I wanted to own the results, not just the creative work. That's where I learned to measure everything. After four years, I was running a team of five, but I was mostly managing budgets and not doing much marketing myself. So when my wife got a job offer in Vancouver, I saw it as a chance to reset. Here, I took a smaller role at an e-commerce startup, partly to learn the Canadian market, and partly because I wanted to get my hands dirty again. Now I know the market, and I'm ready to lead again, but in a company I actually care about. I've been buying your jackets for two winters now."]], "words": 189, "kind": "answer", "setting": "Digital Marketing Manager, an outdoor clothing brand in Vancouver", "cand": "Lucas", "coach": "Each move has a reason, and the reasons tell a story of growth. He even explains the step down in Canada as a deliberate choice, which removes a question before the interviewer asks it.", "t": [[0.4, 3.79], [4.07, 5.71], [6.74, 7.45], [7.73, 14.73], [15.01, 21.17], [21.45, 28.32], [28.6, 30.56], [30.84, 38.22], [38.5, 43.35], [43.63, 52.63], [52.91, 58.26], [58.54, 61.1]]}, {"num": 5, "title": "What Can't I See on Your Resume?", "lines": [["P", "I've read your resume. What's something I can't see on it?"], ["S", "Probably that I'm the person people come to when they don't know who else to talk to. My title in Brazil was HR analyst, and on paper I did recruitment and payroll. But the thing I did most, that doesn't appear anywhere, was sit with employees who had a problem they didn't want to take to their manager. A worker whose pay was wrong for three months. A supervisor who didn't know how to handle a harassment complaint. One year, our site in Campinas had forty percent turnover, and my director asked me to find out why. I spent two weeks talking to people on the night shift. It turned out the problem wasn't pay at all. It was that the night shift never got training, so they felt stuck. We changed the training schedule, and the turnover dropped to about fifteen percent the next year. None of that is on my resume, because there's no box for it. But I think it's the most useful thing I'd bring to a construction company."]], "words": 184, "kind": "answer", "setting": "HR Generalist, a construction company in Edmonton", "cand": "Juliana", "coach": "Candidates prepare for the resume and freeze when asked to go beyond it. Juliana names a quality, proves it with a story, and gives a result, all without repeating a single line from her resume.", "t": [[0.4, 1.91], [2.19, 4.11], [5.14, 9.69], [9.97, 15.37], [15.65, 22.3], [22.58, 24.86], [25.14, 28.62], [28.9, 35.0], [35.28, 37.95], [38.23, 40.28], [40.56, 43.78], [44.06, 49.07], [49.35, 52.62], [52.9, 56.84]]}, {"num": 6, "title": "Explain What You Do", "lines": [["P", "Imagine I'm not an engineer. How would you explain what you do to someone outside your field?"], ["S", "I'd say I'm the person who makes sure a bridge gets built the way it was designed, on time, and without anyone getting hurt. The designers draw the bridge. The construction crews build it. And in the middle, there are hundreds of small decisions every week. The steel arrives late, so what do we build first? The soil is softer than the report said, so do we change the foundation? A supplier sends the wrong bolts. My job is to catch those problems early, find the answer, and make sure everyone is working from the same information. If I do my job well, nobody notices me. If I do it badly, you notice, because the bridge opens six months late. On my last project in Belo Horizonte, it was a highway overpass, and we opened it eleven days early. That's the part of the job I like best."]], "words": 165, "kind": "answer", "setting": "Project Engineer, an infrastructure firm in Ottawa", "cand": "Thiago", "coach": "Plain words, a clear picture, and a little humour. A strong answer to this question shows you understand your own work well enough to make it simple.", "t": [[0.4, 2.3], [2.58, 5.69], [6.72, 14.72], [15.0, 16.71], [16.99, 18.76], [19.04, 22.97], [23.25, 26.19], [26.47, 30.93], [31.21, 33.38], [33.66, 41.26], [41.54, 44.68], [44.96, 49.63], [49.91, 57.12], [57.4, 59.74]]}]}, {"part": 2, "title": "Your Resume, Probed", "scripts": [{"num": 7, "title": "How Did You Actually Do That?", "lines": [["P", "Your resume says you reduced customer cancellations by eighteen percent. Walk me through how that actually happened."], ["S", "Sure. I want to be precise about my part, because it was a team result. I worked for an internet provider in Porto Alegre. The retention team knew that about four percent of customers cancelled every month, and they were offering discounts to anyone who called to cancel, which was expensive and didn't work very well. My part was the analysis. I combined three years of billing data with the support tickets, and I built a model that predicted who would cancel about sixty days before they did it. The biggest signal wasn't price, which surprised everyone. It was repeated technical problems. Customers with three or more support calls in a month were five times more likely to leave. So I proposed that the retention team call those customers first and fix the technical problem, instead of offering a discount. My manager agreed to a three-month test in one region. Cancellations in that region dropped eighteen percent, and the company rolled it out nationally."]], "words": 181, "kind": "answer", "setting": "Data Analyst, a telecommunications company in Toronto", "cand": "Fernanda", "coach": "Notice the words 'my part was.' Fernanda separates the team's result from what she personally did, which is exactly what a Canadian interviewer is listening for.", "t": [[0.4, 5.01], [5.29, 7.72], [8.75, 9.35], [9.63, 13.68], [13.96, 16.99], [17.27, 28.94], [29.22, 30.8], [31.08, 40.49], [40.77, 44.14], [44.42, 46.57], [46.85, 52.46], [52.74, 60.72], [61.0, 64.54], [64.82, 70.56]]}, {"num": 8, "title": "The Hidden Hard Part", "lines": [["P", "What was the hardest part of your last job that isn't obvious from the title?"], ["S", "My title was account manager, so people assume the hard part was selling. It wasn't. The hardest part was saying no to my own clients. We sold software to hospitals, and our clients always wanted custom features. If I said yes to everything, the product team would get fifty requests a month and deliver none of them. If I said no too often, I'd lose the client. So I had to learn to say, this isn't coming this year, but here's what we can do instead. In my first year, I made a lot of promises I couldn't keep, and one hospital almost cancelled. After that, I changed my approach. I started meeting with the product team every two weeks, so I knew what was realistic before I spoke to clients. In my second year, I had the lowest client loss in my region, with only one hospital leaving out of thirty-five."]], "words": 167, "kind": "answer", "setting": "Account Manager, a software company in Montreal", "cand": "Pedro", "coach": "Pedro picks something truly difficult, admits he struggled with it at first, and shows what he changed. That combination is far more convincing than claiming it was all easy.", "t": [[0.4, 4.5], [5.53, 9.88], [10.16, 10.86], [11.14, 13.92], [14.2, 18.87], [19.15, 24.69], [24.97, 27.47], [27.75, 32.29], [32.57, 38.1], [38.38, 40.24], [40.52, 46.87], [47.15, 53.96]]}, {"num": 9, "title": "Why Did You Leave?", "lines": [["P", "Why did you leave your last role?"], ["S", "The simple answer is that I moved to Canada. But I'll give you the honest one too, because I think it matters. I was general manager of a restaurant in São Paulo for five years, and I loved it. But the owners decided to sell to a larger group, and the new owners wanted to standardise everything, same menu, same suppliers, same everything, across twenty locations. I understood the business reason. But it meant my job was going to become following a manual, and I'm at my best when I can solve problems my own way. At the same time, my husband and I had been talking about Canada for years. So it felt like the right moment. I left on good terms. I stayed three extra months to train my replacement, and the owner is still one of my references. You're welcome to call him."]], "words": 153, "kind": "answer", "setting": "Restaurant General Manager, a hospitality group in Vancouver", "cand": "Beatriz", "coach": "She never criticises the old employer. She gives a real reason, shows she left responsibly, and offers a reference. That removes any doubt about why she left.", "t": [[0.4, 2.45], [3.48, 6.04], [6.32, 9.48], [9.76, 14.6], [14.88, 25.31], [25.59, 27.28], [27.56, 34.51], [34.79, 39.12], [39.4, 41.02], [41.3, 42.77], [43.05, 48.58], [48.86, 50.2]]}, {"num": 10, "title": "The Gap in Your Resume", "lines": [["P", "There's a gap here, between March of last year and January. What happened?"], ["S", "That's when I moved to Canada. We arrived in March, and I'll be honest, the first few months were about getting settled. Finding an apartment, getting my son into school, getting a credit history, all the things nobody tells you take so long. But I didn't want the gap to be empty. So from June to December, I did two things. First, I completed the AWS Solutions Architect certification, because I noticed that almost every job posting here asked for cloud experience. And second, I built a small open-source tool that helps newcomers compare mobile phone plans. It has about four hundred users now, and I learned more about deploying to the cloud from that project than from the course. In January, I started a contract role, which is the most recent job on my resume. So the gap is real, but I used it on purpose."]], "words": 160, "kind": "answer", "setting": "Software Developer, a logistics software company in Vancouver", "cand": "Rafael", "coach": "Don't hide a gap or apologise for it. Explain it in one sentence, then show what you did with the time. Rafael turns the gap into evidence that he learns fast.", "t": [[0.4, 3.56], [3.84, 4.71], [5.74, 7.21], [7.49, 12.12], [12.4, 19.34], [19.62, 21.47], [21.75, 24.16], [24.44, 34.13], [34.41, 40.0], [40.28, 47.45], [47.73, 52.91], [53.19, 55.71]]}, {"num": 11, "title": "Your Best Job and Your Worst", "lines": [["P", "Which of your past jobs did you do best? And which did you do worst?"], ["S", "I did my best work at the mining company in Belo Horizonte, as a senior accountant. I had a manager who gave me clear goals and then left me alone, and I closed our monthly books in four days instead of nine, which the finance director still mentions when I talk to him. My worst was my first job, at a big audit firm. I was twenty-three, and I thought being good meant never asking questions. So I spent hours stuck on things a senior could have explained in five minutes. My reviews were average, and honestly, they were fair. What I learned is that I work best when I understand the purpose of what I'm doing. Now, when I start a new role, I ask a lot of questions in the first month, even if it feels uncomfortable. I'd rather look new for a few weeks than be slow for a year."]], "words": 168, "kind": "answer", "setting": "Senior Accountant, a mining company in Vancouver", "cand": "Camila", "coach": "Being honest about a weak period is a strength when you show the lesson. Camila's worst job becomes proof of self-awareness, and her best job comes with a number.", "t": [[0.4, 3.02], [3.3, 5.01], [6.04, 10.9], [11.18, 22.13], [22.41, 25.35], [25.63, 29.66], [29.94, 34.23], [34.51, 37.35], [37.63, 42.09], [42.37, 48.51], [48.79, 51.67]]}, {"num": 12, "title": "What You Inherited, What You Left", "lines": [["P", "When you started your last role, what did you inherit? And what did you leave behind?"], ["S", "I inherited a bit of a mess, to be honest. When I joined the food company in Curitiba as procurement manager, we had over three hundred suppliers, no contracts with most of them, and the prices were negotiated by phone, so nobody really knew what we were paying. We'd had two production stops that year because packaging arrived late. So in my first six months, I did three things. I grouped our spending by category, and I found that sixty percent of our money went to just twenty suppliers. I put written contracts in place with those twenty, with delivery penalties. And I found a second supplier for every critical item, so one late truck couldn't stop the factory. When I left, we had about one hundred and forty suppliers, we'd saved around eleven percent on packaging, and we'd gone two full years without a production stop. And I left a supplier handbook, so the next person didn't have to start from zero."]], "words": 179, "kind": "answer", "setting": "Procurement Manager, a food manufacturer in Winnipeg", "cand": "Gustavo", "coach": "A clear before and after. The interviewer can see exactly what changed because Gustavo was there, which is the whole point of the question.", "t": [[0.4, 3.02], [3.3, 4.86], [5.89, 8.13], [8.41, 21.38], [21.66, 25.65], [25.93, 28.6], [28.88, 35.17], [35.45, 39.8], [40.08, 45.95], [46.23, 55.64], [55.92, 60.63]]}, {"num": 13, "title": "What Are You Proudest Of?", "lines": [["P", "Of everything on this page, what are you proudest of? And why that one?"], ["S", "I'd pick the safety programme at my last site, even though it's the smallest line on my resume. We were building a twelve-storey residential tower in Belo Horizonte, and in the first year we had seven lost-time injuries. That means seven people who couldn't come to work because they got hurt. I wasn't the safety manager. I was a site engineer. But I noticed that most of the injuries happened in the first hour of the morning shift, when crews were rushing to set up. So I proposed a fifteen-minute planning meeting at the start of each shift, where each crew leader walked through the day's risks. People complained at first, because it felt like lost time. But in the next eighteen months, we had one lost-time injury. I'm proud of the bigger projects too. But that one mattered more, because those were real people going home to their families."]], "words": 164, "kind": "answer", "setting": "Site Engineer, a residential builder in Toronto", "cand": "Thiago", "coach": "The 'why' is the real question here. Thiago's reason tells the interviewer what he values, and the story shows initiative beyond his job title.", "t": [[0.4, 3.19], [3.47, 4.52], [5.55, 11.67], [11.95, 19.97], [20.25, 24.41], [24.69, 26.61], [26.89, 28.58], [28.86, 35.79], [36.07, 43.48], [43.76, 47.45], [47.73, 51.67], [51.95, 54.36], [54.64, 59.96]]}, {"num": 14, "title": "What Would You Remove?", "lines": [["P", "Here's an unusual one. What's on your resume that you'd remove if you could?"], ["S", "Probably the line that says I managed a budget of two million reais. It's true, and it sounds impressive, but it doesn't tell you much. Managing a budget can mean making smart decisions, or it can mean approving invoices. In my case, for the first year, it was mostly approving invoices. What I'd rather show you is what I did with a much smaller budget. At the startup here in Vancouver, I had fifteen thousand dollars for a whole quarter. With that, I ran a series of small tests on LinkedIn and Google, and I found one message about saving time on payroll that performed three times better than the others. We moved the whole budget to that message, and our cost per lead fell from about ninety dollars to thirty-two. That's the skill I'd want you to see. So if I rewrote my resume tomorrow, I'd make the big number smaller and the small number bigger."]], "words": 171, "kind": "answer", "setting": "Marketing Specialist, a software company in Vancouver", "cand": "Lucas", "coach": "This question tests honesty about your own resume. Lucas admits a line is inflated, then replaces it with a stronger, more specific result.", "t": [[0.4, 1.83], [2.11, 4.8], [5.83, 10.07], [10.35, 13.68], [13.96, 19.34], [19.62, 23.46], [23.74, 27.21], [27.49, 32.44], [32.72, 43.2], [43.48, 49.75], [50.03, 51.72], [52.0, 57.93]]}, {"num": 15, "title": "How Much Have You Used AI?", "lines": [["P", "Let's talk about AI for a minute. How much have you used it in your work?"], ["S", "Quite a lot, and I can show you, because I keep examples on GitHub. I use AI tools almost every day, but for specific jobs, not for everything. The biggest one is writing code. When I build an analysis in Python or SQL, I use an AI assistant to write the first draft of routine code, like cleaning a messy file or building a chart. That saves me about an hour a day. But I always test what it writes, because it can make mistakes that look very convincing. Last year, it gave me a query that looked perfect but counted some customers twice. I caught it because I always check the totals against our billing system. The second way I use it is to explain my work. When I have a technical analysis, I ask it to help me draft a short summary for managers, and then I rewrite it in my own words. On my GitHub, there are three small projects that show this, including a model that predicts customer cancellations, with notes on where I used AI and where I didn't. So AI makes me faster, but I'm still responsible for every number I send."]], "words": 214, "kind": "answer", "setting": "Data Analyst, an insurance company in Toronto", "cand": "Fernanda", "coach": "Canadian employers now expect candidates to use AI, and to use it responsibly. Fernanda names specific uses, the time she saves, a mistake she caught, and evidence the interviewer can check on GitHub.", "t": [[0.4, 2.55], [2.83, 5.12], [6.15, 10.31], [10.59, 15.96], [16.24, 18.04], [18.32, 29.71], [29.99, 31.95], [32.23, 37.33], [37.61, 42.64], [42.92, 47.1], [47.38, 50.33], [50.61, 58.72], [59.0, 69.64], [69.92, 74.96]]}]}, {"part": 3, "title": "Behavioural Questions: STAR", "scripts": [{"num": 16, "title": "An Impossible Deadline", "lines": [["P", "Tell me about a time you had to deliver something on an impossible deadline."], ["S", "Last November, at the warehouse in Richmond, our largest customer moved their holiday promotion forward by one week. That meant we had four days to ship eleven thousand orders that we'd planned to ship over eleven days. I was the shift coordinator, so it was my job to figure out whether it was possible and how. First, I looked at where we were losing time, and it was packing, not picking. So I split the packing line into two teams, one for single-item orders and one for multi-item orders, because single-item orders take half the time. Then I asked our manager to approve two evening shifts with volunteers, and I built the schedule myself that night. I also called the carrier and asked for a second pickup each day, so orders didn't sit on the floor. We shipped all eleven thousand orders in four days, with an error rate under one percent. The customer renewed their contract in January, and they mentioned that week specifically."]], "words": 179, "kind": "answer", "setting": "Logistics Coordinator, a retail distributor in Mississauga", "cand": "Mariana", "coach": "A textbook STAR answer. Situation and task in two sentences, a long, detailed action told with 'I,' and a result with two numbers.", "t": [[0.4, 5.16], [6.19, 13.5], [13.78, 19.69], [19.97, 25.31], [25.59, 30.05], [30.33, 40.14], [40.42, 46.88], [47.16, 52.84], [53.12, 58.13], [58.41, 63.4]]}, {"num": 17, "title": "Persuading Someone More Senior", "lines": [["P", "Describe a time you persuaded someone more senior to change their mind."], ["S", "At the internet provider in Brazil, our marketing director wanted to launch a big discount campaign for new customers. He'd already presented it to the executive team, and the budget was about three million reais. When I looked at the numbers, I saw a problem. New customers who joined with a discount cancelled at twice the normal rate once the discount ended. So the campaign would bring people in, but most of them would be gone within a year. I knew I couldn't just say, your plan is wrong. So I asked for thirty minutes with him, and I brought one chart, not twenty. It showed what happened to customers from our last two discount campaigns, month by month. Then I suggested an alternative. Keep the campaign, but make the discount smaller and add a free installation instead, because installation problems were a big reason people left early. He didn't agree in the meeting. But two days later, he changed the plan. Twelve-month retention for that campaign was about thirty percent higher than the previous one."]], "words": 188, "kind": "answer", "setting": "Business Intelligence Analyst, a bank in Toronto", "cand": "Fernanda", "coach": "Fernanda shows respect for seniority without giving up her point. One clear chart, a better alternative, and patience. That is how persuasion usually works in Canadian workplaces.", "t": [[0.4, 5.2], [6.23, 13.46], [13.74, 19.57], [19.85, 22.38], [22.66, 29.02], [29.3, 34.0], [34.28, 36.81], [37.09, 41.66], [41.94, 47.21], [47.49, 49.49], [49.77, 59.29], [59.57, 61.08], [61.36, 63.71], [63.99, 69.52]]}, {"num": 18, "title": "Improving What Nobody Asked You To", "lines": [["P", "Tell me about a time you improved something nobody asked you to improve."], ["S", "In my first month at the food company, I noticed that every Friday, one of our analysts spent the whole afternoon copying numbers from supplier emails into a spreadsheet. It was our weekly inventory report. Nobody had asked me to look at it, and it wasn't my team. But it bothered me, because the report was also full of small errors, and the plant managers didn't trust it. So I spent a few evenings building a simple template that suppliers could fill in directly, and a macro that combined all the files automatically. Then I went to the analyst first, not his manager, and asked if he'd like to try it. I didn't want him to feel I was criticising his work. He tested it for two weeks and suggested some improvements. After that, the report took about twenty minutes instead of four hours. And because it had fewer errors, the plant managers started using it for their planning meetings, which they'd never done before."]], "words": 178, "kind": "answer", "setting": "Supply Chain Analyst, an agricultural equipment company in Regina", "cand": "Gustavo", "coach": "Initiative plus tact. Gustavo spots the problem, fixes it on his own time, and involves the person affected before going to management.", "t": [[0.4, 4.3], [5.33, 15.55], [15.83, 17.84], [18.12, 21.17], [21.45, 27.64], [27.92, 37.13], [37.41, 42.19], [42.47, 45.44], [45.72, 49.04], [49.32, 53.25], [53.53, 60.57]]}, {"num": 19, "title": "Saying No", "lines": [["P", "Describe a time you had to say no to a customer or a colleague."], ["S", "One of my hospital clients, a big account, asked us to connect our software to an old lab system they were using. They wanted it in six weeks, and they said that if we couldn't do it, they'd look at other vendors. I checked with our engineers, and the honest answer was that it would take at least five months, and it would delay work we'd promised to twelve other clients. So I had to say no. But I didn't want to just send an email. I went to the hospital in person, and I explained why we couldn't do it in six weeks, and what it would cost other customers if we tried. Then I offered two alternatives. A manual export that their lab team could run once a day, which we could set up in one week. And a real integration in our product plan for the following year. They were not happy in the meeting. But they accepted the manual export, and they renewed their contract for three more years."]], "words": 187, "kind": "answer", "setting": "Customer Success Manager, a software company in Calgary", "cand": "Pedro", "coach": "Saying no well means giving the reason, the cost of saying yes, and an alternative. Pedro does all three and keeps the client.", "t": [[0.4, 3.81], [4.84, 11.73], [12.01, 16.96], [17.24, 25.82], [26.1, 27.32], [27.6, 29.45], [29.73, 37.41], [37.69, 39.36], [39.64, 45.01], [45.29, 48.83], [49.11, 50.54], [50.82, 55.86]]}, {"num": 20, "title": "Learning Something Difficult, Fast", "lines": [["P", "Tell me about a time you had to learn something difficult, fast."], ["S", "At my contract job here in Vancouver, two weeks after I started, the only person who understood our Kubernetes setup left the company. I'd used Kubernetes a little, but I'd never managed a production cluster. And we had a major release planned in three weeks. So I made a plan. For the first week, I didn't try to learn everything. I focused only on the three things that broke most often, which I found by reading six months of incident reports. I spent evenings reproducing each problem in a test environment until I could fix it without looking anything up. In the second week, I wrote a short runbook for each one, so the rest of the team didn't depend only on me. And I found an engineer at a partner company who agreed to answer questions for an hour each week. The release went out on time. We had one incident during the launch, and I fixed it in about twenty minutes. The runbooks are still used today."]], "words": 181, "kind": "answer", "setting": "Platform Engineer, a health technology company in Vancouver", "cand": "Rafael", "coach": "Rafael doesn't just say 'I learned it.' He explains how he learned it: focusing on what mattered most, practising, writing it down, and finding help.", "t": [[0.4, 3.62], [4.65, 12.97], [13.25, 17.33], [17.61, 20.04], [20.32, 21.3], [21.58, 24.16], [24.44, 31.01], [31.29, 37.97], [38.25, 44.14], [44.42, 50.11], [50.39, 51.86], [52.14, 56.33], [56.61, 58.23]]}, {"num": 21, "title": "Acting on Incomplete Information", "lines": [["P", "Describe a time you had to act on incomplete information."], ["S", "It was a Saturday night at the restaurant in São Paulo. We had a full house, about one hundred and eighty reservations, and at seven o'clock, two guests at the same table said they felt sick after their appetisers. I didn't know if it was food poisoning, an allergy, or something unrelated, and I couldn't wait to find out. As the general manager, I had to decide quickly. I stopped serving the dish they'd both eaten, a shrimp starter, immediately. I asked the chef to keep the remaining shrimp separate so it could be tested. I made sure the two guests got medical help, and I personally called them the next morning. I didn't close the restaurant, because I had no evidence that anything else was affected, and I told the staff exactly what to say if other guests asked. It turned out that the supplier had delivered shrimp from a bad batch. Because we'd stopped the dish within ten minutes, no one else got sick. And the next week, I changed suppliers."]], "words": 183, "kind": "answer", "setting": "Operations Manager, a hotel in Banff", "cand": "Beatriz", "coach": "The key phrase is 'I didn't know.' Beatriz shows how she made a proportionate decision, acted fast on what she could control, and avoided overreacting.", "t": [[0.4, 3.86], [4.89, 7.87], [8.15, 17.3], [17.58, 23.62], [23.9, 26.85], [27.13, 31.07], [31.35, 35.17], [35.45, 40.25], [40.53, 49.41], [49.69, 52.99], [53.27, 56.86], [57.14, 59.27]]}, {"num": 22, "title": "Delivering Bad News", "lines": [["P", "Tell me about the last time you delivered bad news."], ["S", "On the overpass project in Belo Horizonte, about halfway through, our survey found that the soil under two of the columns was much weaker than the original report said. It meant a redesign of those foundations, about seven weeks of delay, and roughly four hundred thousand reais in extra cost. The client was the city, and they had already announced an opening date. I was the project engineer, and my director asked me to prepare the explanation. I had one rule: they would hear it from us first, not from the press. So we met the city engineers the same week. I brought the soil results, the new design options, and a recovery plan. I was clear about what we knew and what we didn't know yet. I didn't try to make it sound smaller than it was. They were frustrated, but they approved the redesign in the same meeting. And because of the recovery plan, the final delay was only four weeks, not seven."]], "words": 175, "kind": "answer", "setting": "Project Manager, a transit infrastructure firm in Montreal", "cand": "Thiago", "coach": "Deliver bad news early, directly, and with a plan. Thiago tells the whole truth, including what he doesn't know, and that builds trust.", "t": [[0.4, 2.94], [3.97, 15.08], [15.36, 23.96], [24.24, 28.4], [28.68, 34.06], [34.34, 38.45], [38.73, 41.34], [41.62, 46.14], [46.42, 49.83], [50.11, 53.08], [53.36, 57.69], [57.97, 63.45]]}, {"num": 23, "title": "Seeing the Problem First", "lines": [["P", "Describe a time you saw a problem before anyone else did."], ["S", "At the mining company in Brazil, I was reviewing our monthly costs, and I noticed that our electricity bills at one site had gone up by about twelve percent over three months. Nobody had flagged it, because it was still within the annual budget. But production at that site had actually gone down, so the costs should have gone down too. I didn't want to raise an alarm without being sure, so I compared the bills to the equipment logs for the same period. Two large water pumps were running twenty-four hours a day, including on weekends when the site was mostly closed. I sent a short summary to the site manager with the data, and I suggested that maintenance check the pump controls. It turned out a sensor had failed, and the pumps never switched off. Fixing it cost about three thousand reais. It saved us around two hundred thousand a year."]], "words": 164, "kind": "answer", "setting": "Financial Planning Analyst, a telecommunications company in Toronto", "cand": "Camila", "coach": "She checks before she raises the alarm, and she brings data, not just a worry. The contrast between the small fix and the large saving makes the result memorable.", "t": [[0.4, 4.18], [5.21, 15.23], [15.51, 19.12], [19.4, 24.07], [24.35, 30.79], [31.07, 37.79], [38.07, 44.52], [44.8, 48.25], [48.53, 50.88], [51.16, 53.74]]}, {"num": 24, "title": "When Everything Is Urgent", "lines": [["P", "Tell me about a time everything was urgent. How did you choose?"], ["S", "There was one week in Campinas when three things landed on my desk on the same Monday. The payroll system had failed, and two hundred workers might not be paid on Friday. A supervisor had a serious complaint against him. And the director wanted our hiring plan for a new site by Wednesday. I couldn't do all three at once, so I asked myself one question: what can't be undone? If people aren't paid, you lose trust that takes years to rebuild. So payroll came first. I spent Monday and Tuesday with IT and our bank, and we set up manual transfers as a backup. The complaint came second, because it involved people's safety and it had legal deadlines. I started the investigation on Tuesday, and I brought in a colleague to help. The hiring plan was important, but it wasn't going to hurt anyone if it was two days late. So I called the director, explained my priorities, and asked for Friday instead. Everyone was paid on time, and he agreed to the new date."]], "words": 188, "kind": "answer", "setting": "HR Business Partner, a retail chain in Vancouver", "cand": "Juliana", "coach": "Juliana gives the interviewer her decision rule, 'what can't be undone,' and shows she negotiated the deadline she couldn't meet instead of missing it quietly.", "t": [[0.4, 3.24], [3.52, 4.88], [5.91, 10.69], [10.97, 15.49], [15.77, 18.33], [18.61, 22.18], [22.46, 27.13], [27.41, 30.72], [31.0, 32.36], [32.64, 38.29], [38.57, 43.5], [43.78, 48.09], [48.37, 53.34], [53.62, 58.12], [58.4, 61.33]]}, {"num": 25, "title": "Fixing What You Didn't Break", "lines": [["P", "Describe a time you had to fix something you didn't break."], ["S", "At the fintech company in Recife, a developer on another team deployed a change on a Friday evening and then left for a long weekend. By Saturday morning, about three percent of payments were failing, and I was the engineer on call. The first thing I did was not look for the person responsible. I rolled back his change, and within fifteen minutes the failures stopped. Then I checked whether any customers had been charged twice, because that's the part that really hurts people. We found about four hundred duplicate charges, and I wrote a script to identify them so the support team could refund them on Monday. On Monday, the developer came to me and apologised. I told him it could have happened to anyone. What I did afterwards was propose a rule that we don't deploy payment changes after two o'clock on Fridays, and we added an automatic test for the case that failed. We didn't have another weekend incident like that for the rest of the year."]], "words": 181, "kind": "answer", "setting": "Senior Developer, an e-commerce company in Montreal", "cand": "Rafael", "coach": "He fixes the problem first, protects customers second, and prevents it from happening again third. Notice there's no blame in his answer.", "t": [[0.4, 3.13], [4.16, 12.1], [12.38, 17.75], [18.03, 21.55], [21.83, 25.8], [26.08, 32.08], [32.36, 40.12], [40.4, 43.58], [43.86, 45.8], [46.08, 55.89], [56.17, 59.86]]}, {"num": 26, "title": "A Difficult Colleague", "lines": [["P", "Tell me about working with someone you found difficult."], ["S", "At the internet provider, I worked with a senior engineer who rejected almost every data request I sent him. He'd reply with one word, or not reply at all, and my projects kept getting stuck. At first, I thought he just didn't like me. But then I noticed he treated everyone that way, and he was the only person who could access the network data. So I asked him for coffee, and instead of talking about my requests, I asked him what his week looked like. It turned out he was getting around forty requests a week from different teams, with no priorities, and he was working late every night. After that, I changed how I asked. I sent him one request a week, with the exact query already written, so he only had to check and run it. And I told my manager that we needed a proper request process for his team. Within a month, my requests were coming back in two days instead of two weeks. And he became one of my best references."]], "words": 186, "kind": "answer", "setting": "Data Scientist, an insurance company in Waterloo", "cand": "Fernanda", "coach": "Fernanda describes the behaviour, not the person's character, and she tries to understand him before judging him. The fix is practical and helps others too.", "t": [[0.4, 3.49], [4.52, 11.5], [11.78, 17.22], [17.5, 19.87], [20.15, 26.7], [26.98, 33.21], [33.49, 41.59], [41.87, 43.94], [44.22, 50.56], [50.84, 55.51], [55.79, 60.38], [60.66, 62.98]]}, {"num": 27, "title": "A Risk You Took", "lines": [["P", "Describe a risk you took at work. What happened?"], ["S", "At the sports shoe company, we spent most of our budget on famous athletes. I thought we were paying a lot for very little, because our research showed that our customers trusted runners in their own city more than international stars. So I asked for a small part of the budget, about five percent, to test a programme with forty local running coaches instead. The risk was real. If it failed, I'd have wasted money in a year when the company was cutting costs, and my director had already told me the athletes were untouchable. So I designed it carefully. Three cities, a clear measure, which was sales in stores near each coach's running club, and a ninety-day limit. If it didn't work, we'd stop. It worked better than we expected. Sales in those areas grew fourteen percent, compared to three percent in similar cities without coaches. The next year, the programme expanded to twenty cities. And I learned that a risk is easier to approve when you've already planned how to stop it."]], "words": 183, "kind": "answer", "setting": "Growth Marketing Lead, a fitness app company in Toronto", "cand": "Lucas", "coach": "A good risk story shows judgement, not just courage. Lucas limits the downside, sets a clear measure, and draws a lesson at the end.", "t": [[0.4, 2.23], [2.51, 3.39], [4.42, 8.92], [9.2, 17.82], [18.1, 25.63], [25.91, 27.04], [27.32, 35.88], [36.16, 37.65], [37.93, 44.52], [44.8, 46.29], [46.57, 48.13], [48.41, 54.79], [55.07, 58.06], [58.34, 63.18]]}, {"num": 28, "title": "Carrying Out a Decision You Disagreed With", "lines": [["P", "Tell me about a time you had to carry out a decision you disagreed with."], ["S", "At the construction company in Brazil, the directors decided to end our remote work option for office staff and bring everyone back five days a week. I disagreed. Our engagement survey showed that flexible work was the main reason many of our best people stayed, and I thought we'd lose some of them. I said that clearly in the leadership meeting, with the survey data. But the decision stayed the same. At that point, my job wasn't to keep arguing, and it definitely wasn't to tell employees that I didn't agree. My job was to make the change work as well as possible. So I asked for two things, a three-month transition period and flexibility for people with caregiving responsibilities, and the directors agreed to both. Then I met with every team to explain the reasons honestly. We did lose four people, which I'd predicted. But it was fewer than I'd feared. And six months later, the directors asked me to design a hybrid policy, partly because of the data I'd presented."]], "words": 187, "kind": "answer", "setting": "People Operations Manager, a technology company in Ottawa", "cand": "Juliana", "coach": "Disagree openly in the room, then commit to the decision outside it. Canadian employers call this 'disagree and commit,' and Juliana shows both halves.", "t": [[0.4, 4.62], [5.65, 14.46], [14.74, 15.7], [15.98, 23.45], [23.73, 27.17], [27.45, 29.07], [29.35, 35.21], [35.49, 38.54], [38.82, 47.87], [48.15, 51.33], [51.61, 53.96], [54.24, 55.73], [56.01, 62.81]]}, {"num": 29, "title": "Managing Upwards", "lines": [["P", "Describe a time you had to manage upwards."], ["S", "My manager at the distribution company in São Paulo was brilliant with customers, but he made decisions very quickly and often forgot to tell the team. We'd find out on Monday morning that he'd promised a customer something on Friday afternoon. It was causing a lot of stress. I couldn't change how he worked, but I could make it easier for him to keep us informed. So I suggested a fifteen-minute call every Friday at four, where he'd tell me any new promises, and I'd tell him what the team could realistically do the following week. I also created a shared list of customer commitments that he could update from his phone. At first, he forgot the call about half the time. So I started sending him a short message at three-thirty on Fridays. After two months, it became a habit for him. The Monday surprises mostly stopped, and our on-time rate for special customer requests went from about seventy percent to over ninety."]], "words": 172, "kind": "answer", "setting": "Operations Supervisor, a courier company in Calgary", "cand": "Mariana", "coach": "Managing upwards means making your manager successful, not correcting them. Mariana adapts to her manager's style and builds a simple system around it.", "t": [[0.4, 3.05], [4.08, 13.68], [13.96, 19.33], [19.61, 21.13], [21.41, 26.12], [26.4, 36.11], [36.39, 41.46], [41.74, 44.52], [44.8, 48.7], [48.98, 51.63], [51.91, 60.25]]}, {"num": 30, "title": "Saving Money or Time", "lines": [["P", "Tell me about a time you saved the company money or time."], ["S", "At the food company, we bought plastic packaging from one supplier, and our contract renewed automatically every year with a price increase. When I reviewed it, I saw we'd paid about eighteen percent more over three years, while the market price for that plastic had actually gone down. I was the procurement manager, so it was my job to fix it. I gave myself three months before the next renewal. First, I got quotes from four other suppliers, including two I found at a trade fair. Then I tested samples from the best two on our production line, because a cheaper film that jams the machines isn't really cheaper. One of them worked perfectly. I took the quotes back to our existing supplier and gave them the chance to match the price. They matched most of it, and we signed a two-year contract with a price that followed the market. The saving was about one point two million reais a year. And I kept the second supplier as a backup."]], "words": 182, "kind": "answer", "setting": "Purchasing Manager, a construction supplier in Surrey", "cand": "Gustavo", "coach": "Gustavo shows the whole process: find the problem, gather evidence, test quality, negotiate. The detail about testing on the production line shows real experience.", "t": [[0.4, 3.71], [4.74, 12.86], [13.14, 21.53], [21.81, 25.35], [25.63, 28.47], [28.75, 33.89], [34.17, 42.08], [42.36, 43.86], [44.14, 49.13], [49.41, 54.66], [54.94, 58.18], [58.46, 60.81]]}, {"num": 31, "title": "Under Real Pressure", "lines": [["P", "Describe the last time you were genuinely under pressure. What did people around you see?"], ["S", "Last February, I was working as an assistant manager at a hotel restaurant here in Vancouver. On a Friday night, our head chef went home sick at six o'clock, and we had a private event for ninety people at seven. I felt the pressure, of course. But I've learned that the team watches your face more than they listen to your words. So what they saw was me being calm and very clear. I gathered the kitchen for two minutes and gave each person one job. I asked our most experienced line cook to lead the kitchen, and I told her I'd handle everything else so she could focus. I simplified the menu from three options to two, and I went out and explained it personally to the event organiser before anyone was served. Then I stayed on the floor all night, so guests saw a manager, not a problem. Dinner was served thirty minutes late, but every guest was served. And the organiser booked their next event with us before they left."]], "words": 188, "kind": "answer", "setting": "Guest Services Manager, a resort in Whistler", "cand": "Beatriz", "coach": "The second half of the question is the important part. Beatriz describes her visible behaviour, calm, clear, present, which is what the interviewer is really asking about.", "t": [[0.4, 3.92], [4.2, 6.06], [7.09, 12.65], [12.93, 19.57], [19.85, 21.41], [21.69, 25.57], [25.85, 28.45], [28.73, 32.7], [32.98, 39.87], [40.15, 48.21], [48.49, 52.55], [52.83, 56.26], [56.54, 59.87]]}]}, {"part": 4, "title": "Failure, Conflict and Being Wrong", "scripts": [{"num": 32, "title": "A Project That Failed", "lines": [["P", "Tell me about a project that failed. What was your part in it?"], ["S", "At the sports shoe company, I led the launch of a mobile app for our loyalty programme. We spent eight months and a big budget on it, and a year after launch, fewer than four percent of our customers were using it. It failed. My part in it was real. I was so excited about the idea that I skipped the step I'd normally insist on, which was testing it with real customers first. We asked people in surveys if they'd like an app, and of course they said yes. But when we finally watched people in stores, we saw that nobody wanted to download an app just to get points on shoes they bought twice a year. If I'd done those store visits in month one instead of month nine, we'd have built something much simpler. What I do differently now is test the behaviour, not the opinion. Before I spend real money, I want to see what people actually do. At the startup in Vancouver, that habit saved us from building two features that customers said they wanted but never used."]], "words": 196, "kind": "answer", "setting": "Brand Manager, a food and beverage company in Toronto", "cand": "Lucas", "coach": "Lucas takes clear ownership with 'my part in it was real,' names the exact mistake, and shows the lesson working in a later job. No excuses, no blaming others.", "t": [[0.4, 2.19], [2.47, 3.73], [4.76, 9.65], [9.93, 16.88], [17.16, 17.91], [18.19, 19.57], [19.85, 27.88], [28.16, 32.57], [32.85, 41.62], [41.9, 47.7], [47.98, 51.67], [51.95, 55.96], [56.24, 63.58]]}, {"num": 33, "title": "When You Were Wrong", "lines": [["P", "When were you last wrong about something that mattered?"], ["S", "About six months ago. My team was choosing a database for a new reporting service, and I pushed hard for one I'd used for years. A junior developer suggested a different option, and I dismissed it pretty quickly. I thought it was the new, fashionable choice, and I'd seen fashionable choices fail before. We went with mine. Three months later, the reports were slow, and we were spending a lot of time on workarounds. When I finally sat down and tested the junior developer's option properly, it was about four times faster for our kind of queries. I was wrong, and I was wrong partly because I didn't listen. So I told the team that directly in our next meeting, and I thanked her by name. We migrated over two sprints. And I changed one thing about how I lead. Now, when someone disagrees with me on a technical decision, we test both options for a day before we decide. It costs a little time, but it's already saved us from at least one bad choice."]], "words": 185, "kind": "answer", "setting": "Engineering Team Lead, a software company in Toronto", "cand": "Rafael", "coach": "The strongest answers to this question show you can admit a mistake publicly. Rafael names the ego behind the error, credits his colleague, and changes his process.", "t": [[0.4, 2.75], [3.78, 4.99], [5.27, 11.86], [12.14, 16.77], [17.05, 22.28], [22.56, 23.56], [23.84, 28.98], [29.26, 37.03], [37.31, 40.6], [40.88, 45.29], [45.57, 47.26], [47.54, 49.8], [50.08, 56.88], [57.16, 61.45]]}, {"num": 34, "title": "The Hardest Feedback", "lines": [["P", "What's the hardest feedback you've received? What did you do with it?"], ["S", "A few years ago, my director at the mining company told me that my reports were technically excellent, but nobody read them. That hurt, because I spent a lot of time on them. He showed me a report I'd sent to the leadership team. It was twelve pages long, and the most important number, that we were going to miss our cash target, was on page nine. He said, the executives stopped reading on page two. He was completely right. I'd been writing to show how careful I was, not to help people make decisions. So I changed my approach. Now every report I write starts with three sentences: what's happening, why it matters, and what I recommend. The details are still there, but they come after. I asked my director to review my next three reports, and after the third one, he said I didn't need to send them to him first anymore. I still use that format, and it's probably helped my career more than any technical skill."]], "words": 182, "kind": "answer", "setting": "Controller, a property management company in Vancouver", "cand": "Camila", "coach": "Camila shows that she accepted the feedback without defending herself, and she proves the change with a result. Her three-sentence format is also a useful habit for any report.", "t": [[0.4, 2.77], [3.05, 4.48], [5.51, 12.87], [13.15, 15.62], [15.9, 18.68], [18.96, 25.55], [25.83, 28.84], [29.12, 30.57], [30.85, 35.28], [35.56, 37.12], [37.4, 43.93], [44.21, 46.79], [47.07, 54.52], [54.8, 59.72]]}, {"num": 35, "title": "A Missed Deadline", "lines": [["P", "Tell me about a time you missed a deadline."], ["S", "On a residential tower in Belo Horizonte, I was responsible for delivering the facade design package to the contractor by a certain date, so they could order the glass panels. I missed it by nine days. The reason was that I'd depended on an external consultant for the wind calculations, and I didn't check on his progress until the week before the deadline. By then, he was far behind. The miss had a real cost. The glass supplier had a twelve-week lead time, so our delay pushed the facade installation back almost two weeks. I told my director as soon as I knew, not on the deadline day, and I proposed resequencing the interior work so the crews weren't sitting idle. That reduced the impact to about four days on the overall schedule. What I changed was simple. Now, for anything on the critical path that depends on someone outside my team, I schedule weekly check-ins from the start, and I ask to see work in progress, not just a promise that it's on track."]], "words": 184, "kind": "answer", "setting": "Construction Manager, a commercial builder in Calgary", "cand": "Thiago", "coach": "He doesn't hide the cost or blame the consultant. He owns the failure to follow up, limits the damage, and describes a specific habit he built afterwards.", "t": [[0.4, 2.49], [3.52, 15.17], [15.45, 17.33], [17.61, 27.25], [27.53, 29.47], [29.75, 31.48], [31.76, 38.71], [38.99, 48.44], [48.72, 52.82], [53.1, 54.93], [55.21, 68.1]]}, {"num": 36, "title": "A Conflict You Handled Badly", "lines": [["P", "Describe a conflict you handled badly."], ["S", "In my second year as an account manager, a colleague on the product team promised one of my clients a feature date without asking me. I found out when the client called me, very excited, and I knew the date wasn't realistic. I was angry, and I handled it badly. I replied to his email and copied both our managers, and I said, quite directly, that he'd made a promise he had no right to make. It was probably correct, but it was the wrong way to say it. He felt humiliated in front of his boss, and for about three months, he stopped sharing information with me, which made my job much harder. Eventually, I went to his desk and apologised for how I'd done it, not for what I'd said. We agreed that any client promise would go through a short shared message first. We worked well together after that. What I learned is that copying someone's manager is the last step, not the first. Now I always talk to the person directly before I put anything in writing."]], "words": 187, "kind": "answer", "setting": "Sales Team Lead, a medical devices company in Mississauga", "cand": "Pedro", "coach": "Pedro separates the content of the complaint, which was fair, from the way he delivered it, which wasn't. That distinction shows real maturity.", "t": [[0.4, 2.66], [3.69, 11.22], [11.5, 16.84], [17.12, 19.23], [19.51, 26.85], [27.13, 30.09], [30.37, 38.18], [38.46, 43.73], [44.01, 48.4], [48.68, 50.43], [50.71, 55.47], [55.75, 60.21]]}, {"num": 37, "title": "What Your Manager Would Say", "lines": [["P", "What would your last manager say you most need to work on?"], ["S", "She'd probably say I take on too much myself instead of delegating. In fact, she did say that, in my last performance review. When there's a problem, my instinct is to fix it personally, because I know it'll be done well and I don't want to burden anyone. But in my last role, I was leading a team of three recruiters, and by doing so much myself, I was slowing them down and not letting them grow. One of them told me she felt I didn't trust her with the difficult candidates. That was hard to hear. So I've been working on it deliberately. I started giving each recruiter full ownership of one hiring manager relationship, including the difficult conversations, and I moved from checking their work to a weekly thirty-minute review. It's still not natural for me. But in the last six months before I moved to Canada, my team filled roles about twenty percent faster, and I wasn't working every weekend anymore."]], "words": 176, "kind": "answer", "setting": "Talent Acquisition Specialist, a university in Halifax", "cand": "Juliana", "coach": "Juliana gives a real weakness, not a disguised strength like 'I work too hard.' She shows the impact on others and a concrete plan she's already following.", "t": [[0.4, 3.73], [4.76, 8.45], [8.73, 11.93], [12.21, 19.14], [19.42, 27.64], [27.92, 31.67], [31.95, 33.0], [33.28, 35.24], [35.52, 46.61], [46.89, 48.47], [48.75, 57.18]]}, {"num": 38, "title": "A Decision You'd Change", "lines": [["P", "What decision would you make differently now?"], ["S", "When I restructured our suppliers at the food company, I moved very fast. In about four months, we went from over three hundred suppliers to around one hundred and forty. The savings were real. But I didn't spend enough time with the production managers before I made the changes. I talked to them, but I mostly told them what was happening. I didn't really ask for their input. And a few of the smaller suppliers we dropped were ones the plant depended on for emergencies, like a local company that could deliver spare parts on a Sunday. For about six months, we had some very stressful weekends. If I did it again, I'd spend the first month with the people who actually use what we buy, and I'd ask them one question: which supplier has saved you when something went wrong? Those suppliers aren't always the cheapest, but they're worth keeping. The savings would probably have been a bit smaller, but the plant would have trusted the new system from the start."]], "words": 179, "kind": "answer", "setting": "Operations Manager, a food distributor in Edmonton", "cand": "Gustavo", "coach": "This is not a failure story. It's a judgement story. Gustavo shows he can look back critically at a success and still see what he'd improve.", "t": [[0.4, 2.49], [3.52, 7.96], [8.24, 13.61], [13.89, 15.11], [15.39, 20.17], [20.45, 23.61], [23.89, 25.61], [25.89, 35.64], [35.92, 39.19], [39.47, 49.54], [49.82, 53.4], [53.68, 59.82]]}, {"num": 39, "title": "Damaging a Working Relationship", "lines": [["P", "When have you damaged a working relationship?"], ["S", "At the distribution company in São Paulo, I had a colleague who managed the fleet of trucks, and we depended on each other every day. During a very busy month, a delivery to a hospital was late, and in a team meeting, I said that it was because his drivers had left late. I said it in front of our director. It wasn't completely true. Part of the delay was because my team had loaded the truck late. And even if it had been his fault, a team meeting wasn't the place to say it. After that, he became very formal with me. He only communicated by email, and small problems that we used to solve with a phone call started taking days. I realised I'd done that. So I asked him for lunch, and I told him I'd been unfair and I'd said it in the wrong place. I also corrected it with the director. It took a few months, but we got back to working well togeth
